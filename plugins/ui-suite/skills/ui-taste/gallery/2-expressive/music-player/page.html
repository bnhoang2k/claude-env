<!doctype html>
<html lang="en" data-rung="2" data-look="loud" data-motion="sleek">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<script>
  (function () {
    var p = new URLSearchParams(location.search), t = p.get("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    if (p.get("font") === "system") document.documentElement.dataset.font = "system";
  })();
</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&display=swap">
<style>
  /* ---------- Tokens: colour (draw: post red, mustard) ---------- */
  :root {
    --p-bg: #e2dccf; --p-surface: #d7d0c1; --p-ink: #2a1110; --p-muted: #6b524c; --p-accent: #4a6f84; --p-accent-ink: #ffffff;

    --bg: var(--p-bg);
    --surface: var(--p-surface);
    --ink: var(--p-ink);
    --muted: var(--p-muted);
    --line: color-mix(in srgb, var(--p-ink) 12%, var(--p-bg));
    --hover: color-mix(in srgb, var(--p-ink) 6%, var(--p-bg));
    --accent: var(--p-accent);
    --accent-ink: var(--p-accent-ink);
    --play-bg: var(--p-ink);
    --play-ink: var(--p-bg);
    --tip-bg: var(--p-ink);
    --tip-ink: var(--p-bg);
    --chapter-ink: var(--p-ink);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--p-ink);
      --surface: color-mix(in srgb, var(--p-bg) 9%, var(--p-ink));
      --ink: var(--p-bg);
      --muted: color-mix(in srgb, var(--p-bg) 66%, var(--p-ink));
      --line: color-mix(in srgb, var(--p-bg) 14%, var(--p-ink));
      --hover: color-mix(in srgb, var(--p-bg) 6%, var(--p-ink));
      --play-bg: var(--p-bg);
      --play-ink: var(--p-ink);
      --tip-bg: var(--p-bg);
      --tip-ink: var(--p-ink);
      --chapter-ink: color-mix(in srgb, var(--p-bg) 12%, var(--p-ink));
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--p-ink);
    --surface: color-mix(in srgb, var(--p-bg) 9%, var(--p-ink));
    --ink: var(--p-bg);
    --muted: color-mix(in srgb, var(--p-bg) 66%, var(--p-ink));
    --line: color-mix(in srgb, var(--p-bg) 14%, var(--p-ink));
    --hover: color-mix(in srgb, var(--p-bg) 6%, var(--p-ink));
    --play-bg: var(--p-bg);
    --play-ink: var(--p-ink);
    --tip-bg: var(--p-bg);
    --tip-ink: var(--p-ink);
    --chapter-ink: color-mix(in srgb, var(--p-bg) 12%, var(--p-ink));
    color-scheme: dark;
  }

  /* ---------- Tokens: type, space, radius, motion ---------- */
  :root {
    --font: "Cabinet Grotesk", system-ui, sans-serif;
    --t-hero: 64px; --t-h2: 24px; --t-body: 14px; --t-meta: 13px; --t-lead: 18px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
    --r-cover: 10px; --r-panel: 16px; --r-row: 8px; --r-btn: 8px;
    --cover: clamp(280px, min(56vh, calc(58vw - 380px)), 520px); --cover-sm: 80px;
    --bar-h: 84px;
    /* sleek feel; JS writes the spring curves */
    --tap: 180ms; --tap-touch: ease-out; --fade: 150ms; --chapter: 450ms; --chapter-ease: ease-out;
  }
  :root[data-font="system"] { --font: system-ui, sans-serif; }

  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); height: 100%; }
  body { margin: 0; height: 100%; font: 500 var(--t-body)/1.4 var(--font); background: var(--bg); overflow: hidden; }
  button { font: inherit; color: inherit; }
  h1, h2, p, ol { margin: 0; }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 58fr) minmax(0, 42fr);
    grid-template-rows: minmax(0, 1fr) var(--bar-h);
    height: 100vh; height: 100dvh;
  }

  /* ---------- Now playing: a colour chapter per song ---------- */
  .hero {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end; justify-content: safe center; gap: var(--s5);
    margin: var(--s4) 0 0 var(--s4); padding: var(--s6);
    border-radius: var(--r-panel); min-height: 0; overflow: hidden;
    background: var(--ch-bg, var(--p-accent)); color: var(--ch-ink, #fff);
    transition: background-color var(--chapter) var(--chapter-ease), color var(--chapter) var(--chapter-ease);
  }
  .deck { position: relative; display: flex; align-items: flex-end; gap: var(--s4); min-height: var(--cover); }
  .cover {
    position: relative; flex: none; width: var(--cover-sm); height: var(--cover-sm);
    padding: 0; border: 0; border-radius: var(--r-cover); cursor: pointer;
    background: transparent;
    transform-origin: 0 100%;
    transition: filter var(--fade) ease-out;
  }
  .cover svg.art { display: block; width: 100%; height: 100%; }
  .cover:hover { filter: brightness(1.06); }
  .cover:focus-visible { outline: 3px solid var(--ch-ink, #fff); outline-offset: 3px; }
  .cover.cur { width: var(--cover); height: var(--cover); cursor: default; }

  .cover.cur:hover { filter: none; }
  .cover .tip { bottom: calc(100% + 8px); }
  .cover:hover .tip, .cover:focus-visible .tip { visibility: visible; opacity: 1; transition: opacity var(--fade) ease-out 300ms, visibility 0s; }
  .cover.cur:hover .tip { visibility: hidden; opacity: 0; }
  .cover.leaving { position: absolute; bottom: 0; pointer-events: none; }
  .cover .now {
    position: absolute; left: 12px; bottom: 12px; display: none;
    width: 32px; height: 32px; border-radius: 16px; align-items: center; justify-content: center;
    background: var(--p-accent); color: #fff;
  }
  .cover.cur .now { display: inline-flex; }
  .cover .now svg { width: 16px; height: 16px; }
  /* a hairline in the panel's ink, so a cover keeps its edge when its ground matches the panel */
  .art-wrap { outline: 1.5px solid color-mix(in srgb, currentColor 30%, transparent); outline-offset: -1.5px; }
  .art-wrap { width: 100%; height: 100%; border-radius: var(--r-cover); overflow: hidden; transform-origin: 50% 100%; transition: transform var(--tap) var(--tap-touch); }

  .song { min-width: 0; }
  :lang(vi) { font-family: system-ui, sans-serif; }
  .song h1 { font-size: var(--t-hero); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .song h1[data-size="m"] { font-size: 48px; }
  .song h1[data-size="s"] { font-size: 40px; }
  .song h1[data-size="xs"] { font-size: 32px; line-height: 1.1; }
  .song .by { margin-top: var(--s3); font-size: var(--t-lead); font-weight: 700; overflow-wrap: anywhere; }
  .song .from { margin-top: var(--s1); font-size: var(--t-body); opacity: 0.85; overflow-wrap: anywhere; }

  /* ---------- Queue ---------- */
  .queue { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: var(--s4) var(--s4) 0 var(--s5); }
  .queue-head { padding: calc(var(--s6) - var(--s4)) var(--s3) var(--s3); }
  .queue-head h2 { font-size: var(--t-h2); font-weight: 800; letter-spacing: -0.01em; }
  .queue-head p { color: var(--muted); font-size: var(--t-meta); margin-top: 2px; }
  .list-scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: var(--s4); }
  .hl { position: absolute; left: 0; right: 0; top: 0; height: 0; border-radius: var(--r-row); background: var(--accent); pointer-events: none; }
  .tracks { position: relative; list-style: none; padding: 0; }
  .track { border-radius: var(--r-row); }
  .track button {
    display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; column-gap: var(--s3);
    width: 100%; min-height: 52px; padding: 0 var(--s3);
    border: 0; border-radius: var(--r-row); background: transparent; text-align: left; cursor: pointer;
    transition: background-color var(--fade) ease-out, color var(--fade) ease-out, transform var(--tap) var(--tap-touch);
  }
  .track button:hover { background: var(--hover); }
  .track button:active { transform: scale(0.97); }
  .track button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .num { color: var(--muted); font-size: var(--t-meta); font-variant-numeric: tabular-nums; text-align: right; }
  .t-main { display: flex; flex-direction: column; min-width: 0; }
  /* the row's vertical padding lives on its text, so any visible part of a row shows its title */
  .t-title { padding-top: var(--s2); font-weight: 700; overflow-wrap: anywhere; }
  .t-artist { padding-bottom: var(--s2); color: var(--muted); font-size: var(--t-meta); overflow-wrap: anywhere; }
  .t-artist[hidden] + *, .t-title:last-child { padding-bottom: var(--s2); }
  .dur { color: var(--muted); font-size: var(--t-meta); font-variant-numeric: tabular-nums; }
  .eq { display: none; width: 18px; height: 18px; justify-self: end; }
  .track.playing button, .track.playing button:hover { background: transparent; color: var(--accent-ink); }
  .track.playing.lit button, .track.playing.lit button:hover { background: var(--accent); }
  .track.playing .t-title { font-weight: 800; }
  .track.playing .t-artist, .track.playing .dur { color: var(--accent-ink); }
  .track.playing .num { display: none; }
  .track.playing .eq { display: block; }
  .track.played .t-title { color: var(--muted); font-weight: 500; }

  /* ---------- Bar ---------- */
  .bar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s5);
    padding: 0 var(--s5); background: var(--bg);
  }
  .controls { display: flex; align-items: center; gap: var(--s2); flex: none; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; position: relative;
    width: 36px; height: 36px; padding: 0; border: 0; border-radius: var(--r-btn);
    background: transparent; color: var(--ink); cursor: pointer;
    transition: transform var(--tap) var(--tap-touch), background-color var(--fade) ease-out, color var(--fade) ease-out;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.toggle { color: var(--muted); }
  .icon-btn.toggle[aria-pressed="true"] { color: var(--accent); }
  .icon-btn.toggle .pip { position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: var(--accent); opacity: 0; }
  .icon-btn.toggle[aria-pressed="true"] .pip { opacity: 1; }
  .play { width: 52px; height: 52px; border-radius: 26px; background: var(--play-bg); color: var(--play-ink); }
  .play:hover { background: var(--play-bg); }
  .play svg { width: 22px; height: 22px; }
  .play .ic { display: inline-flex; }
  .tipwrap { position: relative; display: inline-flex; }
  .tip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 20;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    background: var(--tip-bg); color: var(--tip-ink); font-size: var(--t-meta); font-weight: 500;
    visibility: hidden; opacity: 0; pointer-events: none;
    transition: opacity var(--fade) ease-out, visibility 0s linear var(--fade);
  }
  .tipwrap:hover .tip, .tipwrap:has(:focus-visible) .tip { visibility: visible; opacity: 1; transition: opacity var(--fade) ease-out 300ms, visibility 0s; }

  .progress { display: flex; align-items: center; gap: var(--s3); flex: 1; min-width: 0; }
  .time { color: var(--muted); font-size: var(--t-meta); font-variant-numeric: tabular-nums; min-width: 40px; }
  .time.total { text-align: right; }
  .track-bar { position: relative; flex: 1; height: 24px; cursor: pointer; touch-action: none; outline: none; }
  .track-bar .rail { position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--line); }
  .track-bar .fill { position: absolute; left: 0; top: 10px; height: 4px; width: 100%; border-radius: 2px; background: var(--ink); transform-origin: 0 50%; transform: scaleX(0); }
  .track-bar .thumb { position: absolute; top: 5px; left: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; background: var(--ink); transform: scale(0.75); transition: transform var(--tap) var(--tap-touch); }
  .track-bar:hover .thumb, .track-bar:focus-visible .thumb, .track-bar.drag .thumb { transform: scale(1); }
  .track-bar:focus-visible .rail { outline: 2px solid var(--accent); outline-offset: 4px; }
  .track-bar.ticking .fill { transition: transform 1s linear; }
  .track-bar.ticking .thumb { transition: left 1s linear, transform var(--tap) var(--tap-touch); }

  .made-up { color: var(--muted); }

  /* ---------- Data toggle (break-ui chrome, not part of the design) ---------- */
  .data-toggle {
    position: fixed; left: 32px; top: 32px; z-index: 30;
    display: flex; gap: 8px; padding: 4px; border-radius: 10px;
    background: #e4e4e7; font: 400 13px/1 system-ui, -apple-system, sans-serif; color: #18181b;
  }
  .data-toggle button { white-space: nowrap; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; font: inherit; color: #3f3f46; cursor: pointer; }
  .data-toggle button[aria-pressed="true"] { background: #ffffff; color: #18181b; }

  /* ---------- Narrow ---------- */
  @media (max-width: 1100px) {
    :root { --cover: 300px; --cover-sm: 64px; --t-hero: 48px; }
    .song h1[data-size="m"] { font-size: 40px; }
    .song h1[data-size="s"] { font-size: 32px; }
    .song h1[data-size="xs"] { font-size: 24px; }
  }
  @media (max-width: 767px) {
    :root { --cover: 196px; --cover-sm: 56px; --t-hero: 32px; --bar-h: 112px; }
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) var(--bar-h); }
    .hero { margin: var(--s3) var(--s3) 0; padding: 56px var(--s4) var(--s4); gap: var(--s4); }
    .song h1[data-size="m"], .song h1[data-size="s"] { font-size: 24px; }
    .song h1[data-size="xs"] { font-size: 24px; line-height: 1.1; }
    .song .by { font-size: var(--t-body); margin-top: var(--s2); }
    .cover.prev { display: none; }
    .deck { gap: var(--s3); }
    .queue { padding: var(--s2) var(--s3) 0; }
    .queue-head { padding: var(--s3) var(--s2) var(--s2); }
    .bar { flex-direction: column-reverse; justify-content: center; gap: var(--s2); padding: var(--s2) var(--s4) var(--s3); }
    .progress { width: 100%; flex: none; }
    .data-toggle { position: absolute; left: 24px; top: 20px; }
    /* on a phone the song panel and the queue scroll together inside the frame; the bar stays */
    .app { display: block; overflow-y: auto; overscroll-behavior: contain; }
    .list-scroll { overflow: visible; }
    .bar { position: sticky; bottom: 0; height: var(--bar-h); z-index: 5; border-top: 1px solid var(--line); }
  }
  @media (max-width: 380px) {
    .cover.n2 { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .icon-btn:active, .track button:active { transform: none; }
    .art-wrap, .track-bar .thumb { transition: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="hero" id="hero" aria-label="Now playing">
    <div class="deck" id="deck"></div>
    <div class="song" id="song">
      <h1 id="title"></h1>
      <p class="by" id="artist"></p>
      <p class="from" id="album"></p>
    </div>
  </section>

  <section class="queue" aria-label="Queue">
    <div class="queue-head">
      <h2 id="list-name"></h2>
      <p><span id="list-meta"></span> <span class="made-up">(a made-up example)</span></p>
    </div>
    <div class="list-scroll" id="list-scroll">
      <div class="hl" id="hl"></div>
      <ol class="tracks" id="tracks"></ol>
    </div>
  </section>

  <footer class="bar" aria-label="Player">
    <div class="controls">
      <span class="tipwrap">
        <button class="icon-btn toggle" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false" aria-describedby="tip-shuffle">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h2.5c2 0 3 1 4.5 4s2.5 4 4.5 4H17M14.5 11.5 17 14l-2.5 2.5M3 14h2.5c1.2 0 2-.4 2.8-1.3M11.7 7.3C12.5 6.4 13.3 6 14.5 6H17M14.5 3.5 17 6l-2.5 2.5"/></svg>
          <span class="pip"></span>
        </button>
        <span class="tip" role="tooltip" id="tip-shuffle">Shuffle</span>
      </span>
      <span class="tipwrap">
        <button class="icon-btn" id="prev" type="button" aria-label="Previous" aria-describedby="tip-prev">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 4h2v12H5zM16 4.8v10.4a.6.6 0 0 1-.9.5L8 10.5a.6.6 0 0 1 0-1l7.1-5.2a.6.6 0 0 1 .9.5z"/></svg>
        </button>
        <span class="tip" role="tooltip" id="tip-prev">Previous</span>
      </span>
      <span class="tipwrap">
        <button class="icon-btn play" id="play" type="button" aria-label="Play" aria-describedby="tip-play">
          <span class="ic" id="play-ic"></span>
        </button>
        <span class="tip" role="tooltip" id="tip-play">Play</span>
      </span>
      <span class="tipwrap">
        <button class="icon-btn" id="next" type="button" aria-label="Next" aria-describedby="tip-next">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M13 4h2v12h-2zM4 4.8v10.4a.6.6 0 0 0 .9.5L12 10.5a.6.6 0 0 0 0-1L4.9 4.3a.6.6 0 0 0-.9.5z"/></svg>
        </button>
        <span class="tip" role="tooltip" id="tip-next">Next</span>
      </span>
      <span class="tipwrap">
        <button class="icon-btn toggle" id="repeat" type="button" aria-label="Repeat" aria-pressed="false" aria-describedby="tip-repeat">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V8a2.5 2.5 0 0 1 2.5-2.5H16M13.5 3 16 5.5 13.5 8M16 11v1a2.5 2.5 0 0 1-2.5 2.5H4M6.5 17 4 14.5 6.5 12"/></svg>
          <span class="pip"></span>
        </button>
        <span class="tip" role="tooltip" id="tip-repeat">Repeat</span>
      </span>
    </div>
    <div class="progress">
      <span class="time" id="elapsed" data-ui-number>0:00</span>
      <div class="track-bar" id="seek" role="slider" tabindex="0" aria-label="Position in song" aria-valuemin="0">
        <div class="rail"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div>
      </div>
      <span class="time total" id="total" data-ui-number>0:00</span>
    </div>
  </footer>
</div>

<div class="data-toggle" data-ui-chrome role="group" aria-label="Data set">
  <button type="button" data-set="demo">Demo data</button>
  <button type="button" data-set="worst">Worst case</button>
</div>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var reduceQuery = matchMedia("(prefers-reduced-motion: reduce)");
  function reduced() { return reduceQuery.matches; }
  function $(id) { return document.getElementById(id); }

  /* ---------- Feel: sleek, from motion-kit defaults.js ----------
     tap 0.1/0.05 (amount 0.97), enter 0.25/0.05, exit 0.15/0, move 0.25/0.05,
     attention 0.2/0.05 (amount 1.08), celebrate 0.35/0.05, stagger 0.025,
     reduced fade 0.15. Motion's spring mapping from (visualDuration, bounce),
     run for 1.8 x the visual duration as a CSS linear() curve. Bounce only
     answers a touch: a song that ends on its own moves with bounce 0. */
  var FEEL = { tap: [0.1, 0.05], enter: [0.25, 0.05], exit: [0.15, 0], move: [0.25, 0.05], attention: [0.2, 0.05], celebrate: [0.35, 0.05] };
  var ATTENTION_AMOUNT = 1.08, STAGGER = 25, FADE = 150;
  var curves = {};
  function curve(v, b) {
    var key = v + "/" + b;
    if (curves[key]) return curves[key];
    var w0 = (2 * Math.PI) / (1.2 * v), z = Math.max(1 - b, 0.05), T = 1.8 * v, n = 40, pts = [];
    for (var i = 0; i <= n; i++) {
      var t = (T * i) / n, x;
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); x = Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t)); }
      else { x = Math.exp(-w0 * t) * (1 + w0 * t); }
      pts.push(i === n ? "1" : (1 - x).toFixed(4));
    }
    return (curves[key] = "linear(" + pts.join(", ") + ")");
  }
  function spring(kind, touch) {
    var f = FEEL[kind];
    return { duration: Math.round(1800 * f[0]), easing: curve(f[0], touch ? f[1] : 0) };
  }
  root.style.setProperty("--tap", Math.round(1800 * FEEL.tap[0]) + "ms");
  root.style.setProperty("--tap-touch", curve(FEEL.tap[0], FEEL.tap[1]));
  root.style.setProperty("--chapter", Math.round(1800 * FEEL.celebrate[0]) + "ms");
  root.style.setProperty("--chapter-ease", curve(FEEL.celebrate[0], 0));
  function stop(el) { el.getAnimations().forEach(function (a) { a.cancel(); }); }
  function fadeIn(el) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: FADE, easing: "ease-out" }); }

  /* ---------- Covers: drawn from the palette, one motif per album ---------- */

  $("list-name").dir = "auto";
  $("list-meta").textContent = plural(songs.length, "song", "songs") + ", " + totalLen();
  renderSong("none");
  renderDeck("none");
  renderList("none");
  setPlaying(false);
  paintTime();
  addEventListener("resize", function () { placeHl("none"); });
  // rows change height when the web font or a fallback face lands; the block follows the playing row
  if (window.ResizeObserver) new ResizeObserver(function () { placeHl("none"); }).observe(tracksEl);
  if (document.fonts) document.fonts.ready.then(function () { placeHl("none"); });
  if (listScrolls()) listScroll.scrollTop = Math.max(0, rowEls[song().id].offsetTop - 120);

  // for drive.mjs checks
  window.__player = {
    now: function () { return { title: song().title, pos: state.cur, playing: state.playing, at: state.at }; },
    deck: function () { return Array.prototype.map.call(deck.querySelectorAll(".cover:not(.leaving)"), function (c) { return c.className.replace("cover ", "") + ":" + c.dataset.id; }); }
  };
})();
</script>
<script>
  // mark text that is Vietnamese, so :lang(vi) can give it a face that stacks its marks
  (function () {
    var VI = /[ăâđêôơưĂÂĐÊÔƠƯẠ-ỹ]/;
    function mark(root) {
      if (!root || root.nodeType !== 1) return;
      var els = root.matches('[dir="auto"]') ? [root] : [];
      root.querySelectorAll('[dir="auto"]').forEach(function (e) { els.push(e); });
      els.forEach(function (e) {
        var want = VI.test(e.textContent);
        if (want && e.lang !== "vi") e.lang = "vi"; else if (!want && e.lang === "vi") e.removeAttribute("lang");
      });
    }
    mark(document.body);
    new MutationObserver(function (list) {
      list.forEach(function (m) {
        var t = m.target.nodeType === 1 ? m.target : m.target.parentElement;
        if (t) mark(t.closest('[dir="auto"]') || t);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  })();
</script>
