<!doctype html>
<html lang="en" data-rung="2" data-look="loud" data-motion="snappy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake at dusk</title>
<script>
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=gambarino@400&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  /* ---------- tokens: color ---------- */
  :root {
    color-scheme: light;
    --bg: #ff7a1f;
    --surface: #ff8633;
    --ink: #050f16;
    --muted: #5a2306;
    --accent: #050f16;
    --accent-ink: #ff7a1f;
    --line: rgba(5, 15, 22, 0.22);
    --hover: rgba(5, 15, 22, 0.08);
    --well: #050f16;
    --well-ink: #ff7a1f;
    --well-dim: rgba(255, 122, 31, 0.4);
    --shadow: 0 1px 2px rgba(5, 15, 22, 0.25), 0 8px 24px rgba(5, 15, 22, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #050f16;
      --surface: #0c1a24;
      --ink: #ff8633;
      --muted: #c8682c;
      --accent: #ff7a1f;
      --accent-ink: #050f16;
      --line: rgba(255, 134, 51, 0.24);
      --hover: rgba(255, 134, 51, 0.1);
      --well: #ff7a1f;
      --well-ink: #050f16;
      --well-dim: rgba(5, 15, 22, 0.4);
      --shadow: 0 1px 2px rgba(5, 15, 22, 0.3), 0 10px 28px rgba(5, 15, 22, 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #050f16;
    --surface: #0c1a24;
    --ink: #ff8633;
    --muted: #c8682c;
    --accent: #ff7a1f;
    --accent-ink: #050f16;
    --line: rgba(255, 134, 51, 0.24);
    --hover: rgba(255, 134, 51, 0.1);
    --well: #ff7a1f;
    --well-ink: #050f16;
    --well-dim: rgba(5, 15, 22, 0.4);
    --shadow: 0 1px 2px rgba(5, 15, 22, 0.3), 0 10px 28px rgba(5, 15, 22, 0.35);
  }

  /* ---------- tokens: type, space, shape ---------- */
  :root {
    --font-ui: "General Sans", system-ui, sans-serif;
    --font-display: "Gambarino", Georgia, serif;
    --text-meta: 13px;
    --text-ui: 14px;
    --text-h2: 18px;
    --text-h1: 24px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius: 8px;
    --radius-sm: 6px;
    --row: 36px;
    --btn: 32px;
    --tools-w: 220px;
    --history-w: 288px;
    --top-h: 64px;

    /* motion: motion-kit snappy (tap .07/.15, enter .16/.15, exit .10/0, move .16/.15, attention .13/.15).
       JS replaces these with spring linear() curves at boot. */
    --tap-ms: 110ms;    --tap-ease: cubic-bezier(.3, 1.4, .5, 1);
    --enter-ms: 260ms;  --enter-ease: cubic-bezier(.3, 1.3, .5, 1);
    --exit-ms: 180ms;   --exit-ease: cubic-bezier(.4, 0, .6, 1);
    --move-ms: 260ms;   --move-ease: cubic-bezier(.3, 1.3, .5, 1);
    --still-ms: 260ms;  --still-ease: cubic-bezier(.2, .8, .3, 1);
    --fade-ms: 150ms;
    --swap-ms: 90ms;   /* a label swap: the old word fades out in this time, then the new one fades in */
    --glide-ms: 260ms;  --glide-ease: cubic-bezier(.45, 0, .55, 1);  /* rows that make room: even in and out, no front-loaded burst */
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --tap-ms: 0ms; --enter-ms: 0ms; --exit-ms: 0ms; --move-ms: 0ms; --still-ms: 0ms; --glide-ms: 0ms; }
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 var(--text-ui)/1.4 var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  h1, h2 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: 0; }
  h1 { font-size: var(--text-h1); line-height: 1.15; overflow-wrap: anywhere; }
  h2 { font-size: var(--text-h2); line-height: 1.4; }
  .num { font-variant-numeric: tabular-nums; }
  .meta { font-size: var(--text-meta); color: var(--muted); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- buttons ---------- */
  .btn {
    min-height: var(--btn);
    min-width: var(--btn);
    padding: 0 var(--space-3);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: transparent;
    font-size: var(--text-ui);
    font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    cursor: pointer;
    transition: transform var(--tap-ms) var(--tap-ease), background-color var(--fade-ms) linear;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: scale(.95); }
  .btn:disabled { cursor: default; color: var(--muted); border-color: transparent; }
  .btn:disabled:hover { background: transparent; }
  .btn.icon { padding: 0; width: var(--btn); }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); position: relative; overflow: hidden; min-width: 96px; }
  .btn.primary .fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: var(--accent-ink); opacity: .28; transition: transform var(--still-ms) var(--still-ease); }
  /* Every label sits in one cell, so the button keeps one width and no label moves; only the current one shows */
  .btn.primary .labels { position: relative; display: grid; }
  /* Fade-through: the old word is gone before the new one shows, so the two never overlap */
  .btn.primary .label { grid-area: 1 / 1; justify-self: center; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity var(--swap-ms) linear, visibility 0s linear var(--swap-ms); }
  .btn.primary .label.on { opacity: 1; visibility: visible; transition: opacity var(--swap-ms) linear var(--swap-ms), visibility 0s linear var(--swap-ms); }

  .tipwrap { position: relative; display: inline-flex; }
  .tip {
    position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
    background: var(--ink); color: var(--bg);
    font-size: var(--text-meta); font-weight: 500;
    display: none; opacity: 1;
    transition: opacity var(--fade-ms) linear;
    z-index: 5; pointer-events: none;
  }
  .tipwrap:hover .tip, .tipwrap:focus-within .tip { display: block; animation: tip-in var(--fade-ms) linear 300ms both; }
  @keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- shell ---------- */
  .app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
  .top {
    display: flex; align-items: center; gap: var(--space-4);
    min-height: var(--top-h);
    padding: var(--space-2) var(--space-5);
    border-bottom: 1px solid var(--line);
  }
  .title .meta { white-space: nowrap; flex: none; }
  .title { display: flex; align-items: baseline; gap: var(--space-3); min-width: 0; flex: 1; }
  .stepper { display: flex; align-items: center; gap: var(--space-2); }
  .stepper .readout { min-width: 64px; text-align: center; font-weight: 500; }
  .export-slot { display: flex; align-items: center; gap: var(--space-3); }

  /* Test toggle: plain grey test chrome, so it never looks like a second Export */
  .chrome { display: inline-flex; gap: 8px; padding: 4px; background: #e4e4e4; border-radius: 999px; font: 500 13px/1 system-ui, -apple-system, sans-serif; }
  .chrome button {
    min-height: 28px; padding: 0 12px; border: 0; border-radius: 999px;
    background: transparent; font: inherit; cursor: pointer; color: #222; white-space: nowrap;
  }
  .chrome button[aria-pressed="true"] { background: #fff; color: #111; }
  .chrome button:focus-visible { outline: 2px solid #222; outline-offset: 1px; }
  .chrome.at-end { display: flex; width: max-content; margin: var(--space-4) auto; }
  /* A long file name keeps its start and its extension, and gives up the middle */
  h1#file-name { display: flex; min-width: 0; white-space: pre; overflow-wrap: normal; line-height: 1.4; }
  h1#file-name .head { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  h1#file-name .tail { flex: none; }

  main {
    display: grid;
    grid-template-columns: var(--tools-w) minmax(0, 1fr) var(--history-w);
    min-height: 0;
  }
  .tabs { display: none; }

  /* ---------- tools ---------- */
  .tools { border-right: 1px solid var(--line); overflow: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .tools ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .tool {
    position: relative;
    padding: var(--space-2) var(--space-2) var(--space-1);
    border-radius: var(--radius);
    box-shadow: inset 0 0 0 0 var(--ink);
    transition: box-shadow var(--tap-ms) var(--tap-ease);
  }
  .tool.preview { background: var(--hover); box-shadow: inset 0 0 0 1px var(--muted); }
  .tool.touched { box-shadow: inset 0 0 0 2px var(--ink); }
  .tool-head { display: flex; align-items: center; gap: var(--space-2); min-height: 20px; }
  .tool-head svg { width: 16px; height: 16px; flex: none; }
  .tool-head .name { flex: 1; font-weight: 500; }
  /* The value slot keeps one width, so a new value never shifts its box while the thumb springs */
  .tool-head .val { font-size: var(--text-meta); flex: none; min-width: 5.5ch; text-align: right; }
  .slider { position: relative; height: 28px; cursor: pointer; touch-action: none; border-radius: var(--radius-sm); }
  .slider:focus-visible { outline-offset: 0; }
  .slider .track { position: absolute; left: 8px; right: 8px; top: 13px; height: 2px; background: var(--line); border-radius: 1px; }
  .slider .zero { position: absolute; top: 9px; width: 2px; height: 10px; margin-left: -1px; background: var(--line); }
  .slider .ghost { position: absolute; top: 6px; width: 2px; height: 16px; margin-left: -1px; background: var(--muted); opacity: 0; transition: opacity var(--fade-ms) linear; }
  .tool.touched .slider .ghost { opacity: 1; }
  .slider .thumb {
    position: absolute; top: 6px; left: 0; width: 16px; height: 16px; margin-left: -8px;
    border-radius: 50%; background: var(--ink);
    transition: transform var(--move-ms) var(--move-ease);
  }
  .slider .thumb i { position: absolute; inset: 0; border-radius: 50%; transition: transform var(--tap-ms) var(--tap-ease); }
  .slider.dragging .thumb { transition: none; }
  .tool.touched .slider .thumb i, .slider.dragging .thumb i { transform: scale(1.08); }
  .slider-inner { position: absolute; left: 8px; right: 8px; top: 0; bottom: 0; }

  /* ---------- stage ---------- */
  .stage { background: var(--well); display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--space-4); padding: var(--space-5); min-height: 0; }
  .frame-box { container-type: size; min-height: 0; display: grid; place-items: center; }
  .frame {
    width: min(100cqw, 150cqh);
    aspect-ratio: 3 / 2;
    position: relative; overflow: hidden;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    background: #120d1a;
  }
  .frame canvas { display: block; width: 100%; height: 100%; }

  .scrub { position: relative; height: 28px; cursor: pointer; touch-action: none; border-radius: var(--radius-sm); }
  .scrub:focus-visible { outline-color: var(--well-ink); }
  .scrub .rail { position: absolute; left: 8px; right: 8px; top: 13px; height: 2px; background: var(--well-dim); }
  .scrub .done { position: absolute; left: 0; top: 0; height: 2px; width: 100%; background: var(--well-ink); transform-origin: left; transition: transform var(--move-ms) var(--move-ease); }
  .scrub .ticks { position: absolute; left: 8px; right: 8px; top: 8px; height: 12px; }
  .scrub .tick { position: absolute; top: 0; width: 2px; height: 12px; margin-left: -1px; background: var(--well-dim); border-radius: 1px; }
  .scrub .tick.past { background: var(--well-ink); }
  .scrub .knob { position: absolute; left: 8px; top: 4px; width: 20px; height: 20px; margin-left: -10px; transition: transform var(--move-ms) var(--move-ease); }
  .scrub .knob i { position: absolute; inset: 0; border-radius: 50%; background: var(--well-ink); box-shadow: 0 0 0 3px var(--well); transition: transform var(--tap-ms) var(--tap-ease); }
  .scrub.dragging .knob { transition: none; }
  .scrub.dragging .knob i { transform: scale(1.08); }

  /* ---------- history ---------- */
  .history { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .history-head { display: flex; align-items: baseline; justify-content: space-between; padding: var(--space-4) var(--space-4) var(--space-2); }
  .steps { list-style: none; margin: 0; padding: 0 var(--space-2) var(--space-4); overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }
  .step {
    border-radius: var(--radius);
    transition: background-color var(--tap-ms) linear, color var(--tap-ms) linear;
  }
  .step button {
    width: 100%; min-height: var(--row);
    display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-2);
    grid-template-rows: auto 0fr;
    padding: var(--space-2); border: 0; background: transparent; border-radius: var(--radius);
    text-align: left; cursor: pointer; color: inherit;
    transition: grid-template-rows var(--glide-ms) var(--glide-ease) var(--fade-ms);
  }
  .step button:hover { background: var(--hover); }
  .step svg { width: 16px; height: 16px; }
  .step .name { overflow-wrap: anywhere; }
  .step .val { font-size: var(--text-meta); color: var(--muted); text-align: right; }
  /* The "from" line sits in a second grid row that opens (0fr to 1fr) and closes, so the rows below
     glide instead of snapping. Opening: the row first, then the text fades in. Closing: the text fades out, then the row. */
  .step .from {
    display: block; grid-column: 2 / 4; font-size: var(--text-meta); line-height: 1.5; text-align: right;
    min-height: 0; overflow: hidden; opacity: 0; visibility: hidden;
    transition: opacity var(--fade-ms) linear, visibility 0s linear calc(var(--fade-ms) + var(--glide-ms));
  }
  .step.later { color: var(--muted); }
  .step.current { background: var(--accent); color: var(--accent-ink); }
  .step.current .name { font-weight: 600; }
  .step.current .val { color: var(--accent-ink); font-weight: 600; }
  .step.current button { grid-template-rows: auto 1fr; transition: grid-template-rows var(--glide-ms) var(--glide-ease); }
  .step.current .from {
    opacity: 1; visibility: visible;
    transition: opacity var(--fade-ms) linear var(--glide-ms), visibility 0s;
  }
  .step.current button:hover { background: transparent; }
  .step.preview button { background: var(--hover); }

  /* ---------- middle widths ---------- */
  @media (max-width: 1180px) and (min-width: 901px) {
    :root { --tools-w: 200px; --history-w: 240px; }
  }

  /* ---------- phone ---------- */
  @media (max-width: 900px) {
    .app { height: auto; display: block; }
    .top { flex-wrap: wrap; padding: var(--space-3) var(--space-4); gap: var(--space-3); min-height: 0; }
    .title { flex-basis: 100%; flex-wrap: wrap; row-gap: 0; }
    .stepper { order: 1; }
    .export-slot { order: 2; margin-left: auto; }
    main { display: flex; flex-direction: column; }
    .stage { order: 1; padding: var(--space-4); }
    .frame-box { container-type: inline-size; }
    .frame { width: 100%; }
    .tabs { order: 2; display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4) 0; }
    .tabs button { flex: 1; }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .history, .tools { order: 3; border: 0; }
    .tools { overflow: visible; }
    .history { display: block; }
    .history-head { display: none; }
    .steps { max-height: 400px; padding: var(--space-2) var(--space-2) var(--space-4); }
    main[data-tab="history"] .tools { display: none; }
    main[data-tab="adjust"] .history { display: none; }
    .tools > h2 { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <h1 id="file-name">Lake at dusk.jpg</h1>
      <span class="meta">(a made-up example)</span>
    </div>
    <div class="stepper" data-ui-actions>
      <span class="tipwrap">
        <button class="btn icon" data-ui-step="back" id="back" aria-label="Step back" aria-describedby="tip-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <span class="tip" role="tooltip" id="tip-back">Step back, ⌘Z</span>
      </span>
      <span class="readout num" id="readout" data-ui-number aria-live="polite">1 of 1</span>
      <span class="tipwrap">
        <button class="btn icon" data-ui-step="forward" id="forward" aria-label="Step forward" aria-describedby="tip-forward">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <span class="tip" role="tooltip" id="tip-forward">Step forward, ⇧⌘Z</span>
      </span>
    </div>
    <div class="export-slot">
      <button class="btn primary" id="export"><span class="fill"></span><span class="labels"><span class="label on" data-state="idle">Export</span><span class="label" data-state="busy" aria-hidden="true">Exporting</span><span class="label" data-state="done" aria-hidden="true">Saved</span><span class="label" data-state="fail" aria-hidden="true">Export failed</span></span></button>
    </div>
    <div class="chrome" data-ui-chrome role="group" aria-label="Data">
      <button type="button" data-set="demo" aria-pressed="true">Demo data</button>
      <button type="button" data-set="worst" aria-pressed="false">Worst case</button>
      <button type="button" data-set="empty" aria-pressed="false">Empty</button>
    </div>
  </header>

  <main id="main" data-tab="history">
    <section class="tools" id="tools" aria-label="Adjust">
      <h2>Adjust</h2>
      <ul id="tool-list"></ul>
    </section>

    <section class="stage" id="stage" data-ui-pane="reading" aria-label="Photo">
      <div class="frame-box">
        <div class="frame">
          <canvas id="photo" role="img" aria-label="A lake at dusk, with mountains, a low sun, a pier and a boat"></canvas>
        </div>
      </div>
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="History" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
        <div class="rail"><div class="done" id="scrub-done"></div></div>
        <div class="ticks" id="ticks"></div>
        <div class="knob" id="knob"><i></i></div>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Panels">
      <button class="btn" role="tab" id="tab-history" aria-selected="true" aria-controls="history" data-tab="history">History</button>
      <button class="btn" role="tab" id="tab-adjust" aria-selected="false" aria-controls="tools" data-tab="adjust">Adjust</button>
    </div>

    <section class="history" id="history" data-ui-pane="list" aria-label="History">
      <div class="history-head">
        <h2>History</h2>
        <span class="meta num" id="count" data-ui-number hidden></span>
      </div>
      <ol class="steps" id="steps"></ol>
    </section>
  </main>
</div>

<div hidden id="photo-src">
            <svg id="photo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#132a44"/>
                  <stop offset=".42" stop-color="#6e4568"/>
                  <stop offset=".78" stop-color="#ef8a5c"/>
                  <stop offset="1" stop-color="#ffd59c"/>
                </linearGradient>
                <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0" stop-color="#fff2d2" stop-opacity="1"/>
                  <stop offset=".35" stop-color="#ffc27a" stop-opacity=".55"/>
                  <stop offset="1" stop-color="#ff9a5c" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#f2a06c"/>
                  <stop offset=".28" stop-color="#a65f78"/>
                  <stop offset="1" stop-color="#181f36"/>
                </linearGradient>
              </defs>
              <rect width="1200" height="530" fill="url(#sky)"/>
              <circle cx="610" cy="430" r="320" fill="url(#glow)" opacity=".8"/>
              <circle cx="610" cy="428" r="54" fill="#fff0cf"/>
              <path d="M0 470 L110 418 L210 446 L330 376 L450 432 L560 392 L680 452 L770 428 L900 352 L1010 420 L1110 392 L1200 430 L1200 530 L0 530 Z" fill="#8a5a7a"/>
              <path d="M0 500 L90 468 L180 492 L300 438 L420 486 L520 466 L640 506 L760 482 L860 502 L980 452 L1080 492 L1200 468 L1200 530 L0 530 Z" fill="#4a3150"/>
              <rect y="526" width="1200" height="274" fill="url(#water)"/>

    function end(e) {
      if (!row.slider.classList.contains("dragging")) return;
      row.slider.classList.remove("dragging");
      els.stage.classList.remove("live");
      if (live !== null) { var v = live; live = null; commit(t.id, v); }
    }
    row.slider.addEventListener("pointerup", end);
    row.slider.addEventListener("pointercancel", end);
    row.slider.addEventListener("dblclick", function () { commit(t.id, t.def); });
    row.slider.addEventListener("keydown", function (e) {
      var cur = pending && pending.t === t ? pending.v : stateAt(doc.current)[t.id];
      var big = (t.max - t.min) / 10, v = null;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") v = cur + (e.shiftKey ? big : t.step * (t.step < 1 ? 5 : 1));
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") v = cur - (e.shiftKey ? big : t.step * (t.step < 1 ? 5 : 1));
      else if (e.key === "Home") v = t.min;
      else if (e.key === "End") v = t.max;
      if (v === null) return;
      e.preventDefault(); e.stopPropagation();
      v = snap(t, v);
      pending = { t: t, v: v };
      var s = stateAt(doc.current); s[t.id] = v; applyPhoto(s, true); setToolValue(t, v);
      clearTimeout(keyTimer);
      keyTimer = setTimeout(flushKeys, 500);
    });
    row.slider.addEventListener("blur", flushKeys);
  }
  function flushKeys() {
    clearTimeout(keyTimer);
    if (!pending) return;
    var p = pending; pending = null;
    commit(p.t.id, p.v);
  }

  /* ---------- scrubbing the history list ---------- */
  var scrubbing = false;
  function rowIndexAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var li = el && el.closest && el.closest(".step:not(.leaving)");
    return li ? rowEls().indexOf(li) : -1;
  }
  els.steps.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    var i = rowIndexAt(e.clientX, e.clientY);
    if (i < 0) return;
    if (e.pointerType === "mouse") { scrubbing = true; els.steps.setPointerCapture(e.pointerId); }
    setStep(i, { noScroll: true });
  });
  els.steps.addEventListener("pointermove", function (e) {
    if (scrubbing) {
      var i = rowIndexAt(e.clientX, e.clientY);
      if (i >= 0) setStep(i, { noScroll: true });
      return;
    }
    // hover: point at the tools a step touched
    var j = rowIndexAt(e.clientX, e.clientY);
    previewTools(j);
  });
  els.steps.addEventListener("pointerleave", function () { previewTools(-1); });
  function endScrub() { scrubbing = false; }
  els.steps.addEventListener("pointerup", endScrub);
  els.steps.addEventListener("pointercancel", endScrub);
  els.steps.addEventListener("click", function (e) {
    var li = e.target.closest(".step:not(.leaving)");
    if (li) setStep(rowEls().indexOf(li), { noScroll: true });
  });
  els.steps.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      setStep(doc.current + (e.key === "ArrowDown" ? 1 : -1));
      var b = rowEls()[doc.current]; if (b) b.firstChild.focus({ preventScroll: true });
    }
  });
  var previewed = -1;
  function previewTools(i) {
    if (i === previewed) return;
    previewed = i;
    var set = i >= 0 && doc.steps[i] ? doc.steps[i].set : {};
    TOOLS.forEach(function (t) { toolRows[t.id].li.classList.toggle("preview", t.id in set); });
    rowEls().forEach(function (li, k) { li.classList.toggle("preview", k === i); });
  }

  /* ---------- scrubber ---------- */
  function scrubTo(x) {
    var r = els.ticks.getBoundingClientRect(), n = doc.steps.length;
    var f = Math.max(0, Math.min(1, (x - r.left) / r.width));
    setStep(Math.round(f * (n - 1)));
  }
  els.scrub.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    els.scrub.setPointerCapture(e.pointerId);
    els.scrub.classList.add("dragging");
    scrubTo(e.clientX);
  });
  els.scrub.addEventListener("pointermove", function (e) { if (els.scrub.hasPointerCapture(e.pointerId)) scrubTo(e.clientX); });
  function scrubEnd() { els.scrub.classList.remove("dragging"); }
  els.scrub.addEventListener("pointerup", scrubEnd);
  els.scrub.addEventListener("pointercancel", scrubEnd);
  els.scrub.addEventListener("keydown", function (e) {
    var map = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 };
    if (e.key in map) { e.preventDefault(); setStep(doc.current + map[e.key]); }
    else if (e.key === "Home") { e.preventDefault(); setStep(0); }
    else if (e.key === "End") { e.preventDefault(); setStep(doc.steps.length - 1); }
  });

  /* ---------- step controls ---------- */
  els.back.addEventListener("click", function () { flushKeys(); setStep(doc.current - 1); });
  els.forward.addEventListener("click", function () { flushKeys(); setStep(doc.current + 1); });
  document.addEventListener("keydown", function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;
    var k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); flushKeys(); setStep(doc.current - 1); }
    else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); setStep(doc.current + 1); }
  });

  /* ---------- export ---------- */
  var exporting = false;
  function setExport(p, state) {
    els.exportBtn.querySelector(".fill").style.transform = "scaleX(" + p + ")";
    [].forEach.call(els.exportBtn.querySelectorAll(".label"), function (l) {
      var on = l.dataset.state === state;
      l.classList.toggle("on", on);
      if (on) l.removeAttribute("aria-hidden"); else l.setAttribute("aria-hidden", "true");
    });
  }
  function resetExport() { if (!exporting) setExport(0, "idle"); }
  function slug(name) { return name.replace(/\.[a-z]+$/i, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "photo"; }
  els.exportBtn.addEventListener("click", function () {
    if (exporting) return;
    exporting = true;
    els.exportBtn.setAttribute("aria-busy", "true");
    var s = stateAt(doc.current), started = performance.now();
    setExport(0.15, "busy");
    requestAnimationFrame(function () {
      var c = document.createElement("canvas"); c.width = 2400; c.height = 1600;
      paint(c.getContext("2d"), 2400, 1600, s);
      setExport(0.6, "busy");
      c.toBlob(function (blob) {
        if (!blob) { exporting = false; els.exportBtn.removeAttribute("aria-busy"); setExport(0, "fail"); return; }
        setExport(0.9, "busy");
        var wait = Math.max(0, 500 - (performance.now() - started));
        setTimeout(function () {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = slug(doc.name) + ".png";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
          exporting = false;
          els.exportBtn.removeAttribute("aria-busy");
          setExport(1, "done");
        }, wait);
      }, "image/png");
    });
  });

  /* ---------- phone tabs ---------- */
  [].forEach.call(document.querySelectorAll(".tabs [role=tab]"), function (b) {
    b.addEventListener("click", function () {
      els.main.dataset.tab = b.dataset.tab;
      [].forEach.call(document.querySelectorAll(".tabs [role=tab]"), function (o) { o.setAttribute("aria-selected", o === b ? "true" : "false"); });
      requestAnimationFrame(function () { TOOLS.forEach(function (t) { setToolValue(t, stateAt(doc.current)[t.id]); }); });
    });
  });

  /* ---------- data toggle (demo chrome) ---------- */
  function load(set) {
    dataSet = set;
    doc = DATA[set](); doc.steps.forEach(function (s) { s.id = ++uid; });
    var cut = Math.max(0, doc.name.length - 14);
    els.name.textContent = "";
    var head = document.createElement("span"); head.className = "head"; head.textContent = doc.name.slice(0, cut);
    var tail = document.createElement("span"); tail.className = "tail"; tail.textContent = doc.name.slice(cut);
    els.name.append(head, tail);
    els.name.title = doc.name;
    document.title = doc.name.replace(/\.[a-z]+$/i, "");
    buildHistory(); buildTicks();
    shown = null;
    render(null);
    keepInView(rowEls()[doc.current], true);
    [].forEach.call(document.querySelectorAll("[data-set]"), function (b) { b.setAttribute("aria-pressed", b.dataset.set === set ? "true" : "false"); });
  }
  // On a phone the test toggle leaves the header and sits at the end of the page, so the photo comes first.
  var chromeEl = document.querySelector(".chrome"), chromeHome = chromeEl.parentNode;
  var phone = matchMedia("(max-width: 900px)");
  function placeChrome() {
    if (phone.matches) { document.body.appendChild(chromeEl); chromeEl.classList.add("at-end"); }
    else { chromeHome.appendChild(chromeEl); chromeEl.classList.remove("at-end"); }
  }
  placeChrome();
  phone.addEventListener("change", placeChrome);
  [].forEach.call(document.querySelectorAll("[data-set]"), function (b) {
    b.addEventListener("click", function () {
      var u = new URL(location.href);
      if (b.dataset.set === "demo") u.searchParams.delete("data"); else u.searchParams.set("data", b.dataset.set);
      history.replaceState(null, "", u);
      load(b.dataset.set);
    });
  });

  // a size change is not a step: re-place thumbs and the knob with no transition
  var sizes = new WeakMap();
  function placeAll() {
    root.classList.add("no-move");
    TOOLS.forEach(function (t) { setToolValue(t, stateAt(doc.current)[t.id]); });
    placeScrub();
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove("no-move"); }); });
  }
  if ("ResizeObserver" in window) {
    var ro = new ResizeObserver(function (entries) {
      var changed = false;
      entries.forEach(function (en) {
        var w = Math.round(en.contentRect.width);
        if (sizes.get(en.target) !== w) { sizes.set(en.target, w); changed = true; }
      });
      if (changed) placeAll();
    });
    ro.observe(els.ticks);
    new ResizeObserver(sizeCanvas).observe(els.photo);
    TOOLS.forEach(function (t) { ro.observe(toolRows[t.id].inner); });
  }

  /* ---------- boot: first paint holds still ---------- */
  root.classList.add("no-move");
  load(dataSet);
  requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove("no-move"); }); });

  window.photoEditor = {
    snapshot: function () {
      return { step: doc.current + 1, of: doc.steps.length, current: label(doc.steps[doc.current]).name, touched: touched.slice(), state: stateAt(doc.current) };
    },
    setStep: function (i) { setStep(i - 1); },
    exportPreview: function (p) { exporting = true; setExport(p, "busy"); },
    hoverPreview: function (i) { previewTools(i - 1); }
  };
})();
</script>
<style>
  .no-move *, .no-move *::before, .no-move *::after { transition: none !important; }
</style>
</body>
</html>
