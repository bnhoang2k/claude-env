<!doctype html>
<html lang="en" data-rung="2" data-look="quiet" data-motion="whimsical">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver to Lisbon</title>
<script>
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap">
<style>
  /* ---------- tokens: color (dark is the drawn palette; light is designed to match it) ---------- */
  :root {
    color-scheme: light;
    --bg: #f4f3f1;
    --surface: #ffffff;
    --ink: #18191b;
    --muted: #5f6166;
    --faint: #b9bbbf;
    --line: #e2e1de;
    --hover: rgba(24, 25, 27, 0.05);
    --accent: #c8350f;
    --accent-ink: #ffffff;
    --accent-soft: rgba(200, 53, 15, 0.08);
    --shadow: 0 1px 2px rgba(24, 25, 27, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #18191b;
      --surface: #222427;
      --ink: #eff0f1;
      --muted: #9c9ea3;
      --faint: #4a4d52;
      --line: #2e3034;
      --hover: rgba(239, 240, 241, 0.05);
      --accent: #ff4a1f;
      --accent-ink: #18191b;
      --accent-soft: rgba(255, 74, 31, 0.1);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #18191b;
    --surface: #222427;
    --ink: #eff0f1;
    --muted: #9c9ea3;
    --faint: #4a4d52;
    --line: #2e3034;
    --hover: rgba(239, 240, 241, 0.05);
    --accent: #ff4a1f;
    --accent-ink: #18191b;
    --accent-soft: rgba(255, 74, 31, 0.1);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  /* ---------- tokens: type, space, shape, layout ---------- */
  :root {
    --font: "Work Sans", system-ui, sans-serif;
    --text-meta: 13px;
    --text-ui: 14px;
    --text-big: 16px;
    --text-h2: 18px;
    --text-h1: 24px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius: 8px;
    --radius-sm: 6px;
    --btn: 32px;
    --row: 64px;
    --filters-w: 300px;
    --left-w: 380px;
    --count-slot: 17ch;
    --step-slot: 8ch;

    /* motion: motion-kit whimsical (tap .15/.35, enter .48/.35, exit .29/0, move .48/.35, attention .38/.35 x1.1, stagger .065).
       JS swaps these for spring linear() curves at boot. */
    --tap-ms: 260ms;  --tap-ease: cubic-bezier(.3, 1.6, .5, 1);
    --move-ms: 700ms; --move-ease: cubic-bezier(.3, 1.5, .5, 1);
    --calm-ms: 600ms; --calm-ease: cubic-bezier(.2, .8, .3, 1);
    --fade-ms: 150ms;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --tap-ms: 0ms; --move-ms: 0ms; --calm-ms: 0ms; }
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 var(--text-ui)/1.4 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  h1 { font-size: var(--text-h1); line-height: 1.25; letter-spacing: -0.01em; }
  h2 { font-size: var(--text-h2); line-height: 1.3; font-weight: 500; }
  h3 { font-size: var(--text-ui); line-height: 1.4; font-weight: 500; }
  .num { font-variant-numeric: tabular-nums; }
  .meta { font-size: var(--text-meta); color: var(--muted); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  ul, ol { list-style: none; margin: 0; padding: 0; }

  .btn {
    min-height: var(--btn); min-width: var(--btn); padding: 0 var(--space-3);
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    font-size: var(--text-ui); font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    transition: transform var(--tap-ms) var(--tap-ease), background-color var(--fade-ms) linear, border-color var(--fade-ms) linear;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: scale(.95); }
  .btn:disabled { cursor: default; color: var(--muted); background: transparent; }
  .btn:disabled:active { transform: none; }
  .btn.icon { padding: 0; width: var(--btn); }
  .btn svg { width: 16px; height: 16px; }
  .btn[aria-pressed="true"], .seg .btn[aria-checked="true"], .tabs .btn[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .tipwrap { position: relative; display: inline-flex; }
  .tip {
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
    background: var(--ink); color: var(--bg); font-size: var(--text-meta); font-weight: 500;
    display: none; z-index: 5; pointer-events: none;
  }
  .tipwrap:hover .tip, .tipwrap:focus-within .tip { display: block; animation: tip-in var(--fade-ms) linear 300ms both; }
  @keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- shell ---------- */
  /* one page scroll; the filters and both list headers stay pinned while the rows move under them */
  .app { min-height: 100dvh; }
  .top { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); min-height: 64px; }
  .trip { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; row-gap: 0; }
  .trip h1 { overflow-wrap: anywhere; }
  .chrome { display: inline-flex; gap: var(--space-2); }
  .chrome button { min-height: var(--btn); padding: 0 var(--space-2); border: 1px solid var(--line); border-radius: var(--radius); background: transparent; font-size: var(--text-meta); font-weight: 500; color: var(--muted); cursor: pointer; }
  .chrome button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  main { display: grid; grid-template-columns: var(--filters-w) minmax(0, 1fr) var(--left-w); align-items: start; }

  /* ---------- filters ---------- */
  .filters { position: sticky; top: 0; max-height: 100dvh; overflow: auto; padding: var(--space-4) var(--space-5) var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
  .filters-head { display: flex; align-items: center; justify-content: space-between; min-height: var(--btn); }
  .fgroup { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); margin: calc(var(--space-3) * -1); border-radius: var(--radius); transition: background-color var(--fade-ms) linear; }
  .fgroup.lit { background: var(--hover); }
  .fhead { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  .removed { font-size: var(--text-meta); color: var(--muted); display: inline-block; }
  /* counts hold a fixed right-aligned slot, so a new digit does not shift where the count starts */
  .removed { min-width: var(--count-slot); text-align: right; transform-origin: right center; }
  #stepno { min-width: var(--step-slot); text-align: right; flex-shrink: 0; }
  .removed.zero { color: var(--muted); }
  .fgroup.last .removed { color: var(--accent); font-weight: 500; }
  .fvalue { font-size: var(--text-meta); color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .seg .btn { font-size: var(--text-meta); padding: 0 var(--space-2); }

  .range { position: relative; height: 28px; touch-action: none; cursor: pointer; }
  .range .track { position: absolute; left: 9px; right: 9px; top: 13px; height: 2px; background: var(--line); border-radius: 1px; }
  .range .inner { position: absolute; left: 9px; right: 9px; top: 0; bottom: 0; }
  .range .fill { position: absolute; top: 13px; height: 2px; background: var(--ink); border-radius: 1px; transition: left var(--move-ms) var(--move-ease), right var(--move-ms) var(--move-ease); }
  .range .thumb {
    position: absolute; top: 5px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--shadow);
    transition: left var(--move-ms) var(--move-ease), transform var(--tap-ms) var(--tap-ease);
  }
  .range.dragging .thumb, .range.dragging .fill { transition: transform var(--tap-ms) var(--tap-ease); }
  .range .thumb.active { transform: scale(1.1); }

  .airlines { display: flex; flex-direction: column; gap: var(--space-1); }
  .check {
    width: 100%; min-height: 32px; display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: start; gap: var(--space-2);
    padding: var(--space-1) var(--space-2); margin: 0 calc(var(--space-2) * -1); width: calc(100% + var(--space-4));
    border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; text-align: left;
  }
  .check:hover { background: var(--hover); }
  .check .box { margin-top: 1px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted); display: grid; place-items: center; transition: background-color var(--fade-ms) linear, transform var(--tap-ms) var(--tap-ease); }
  .check .box svg { width: 12px; height: 12px; color: var(--bg); opacity: 0; transition: opacity var(--fade-ms) linear; }
  .check[aria-checked="true"] .box { background: var(--ink); border-color: var(--ink); }
  .check[aria-checked="true"] .box svg { opacity: 1; }
  .check:active .box { transform: scale(.95); }
  /* the name and its price share a line that wraps: a long name takes the full width and the price drops under it */
  .check .aline { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--space-2); min-width: 0; }
  .check .aname { overflow-wrap: anywhere; min-width: 0; }
  .check .aline .meta { margin-left: auto; white-space: nowrap; }

  /* ---------- results ---------- */
  .results, .gone { min-height: calc(100dvh - 64px); }
  .gone, .results { border-left: 1px solid var(--line); }
  .rhead { position: sticky; top: 0; z-index: 2; background: var(--bg); }
  .rhead { padding: var(--space-4) var(--space-5) var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); border-bottom: 1px solid var(--line); }
  .rhead-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--btn); }
  .trace { display: flex; align-items: center; gap: var(--space-2); min-height: var(--btn); }
  .trace .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .trace .what b { font-weight: 500; color: var(--accent); }
  .list { padding: var(--space-2) var(--space-3) var(--space-5); }
  .list > li { position: relative; }

  .flight {
    display: grid;
    grid-template-columns: 76px minmax(120px, 1fr) 92px minmax(140px, 1.1fr) 84px;
    align-items: center; column-gap: var(--space-4);
    min-height: var(--row); padding: var(--space-2) var(--space-3);
    border-radius: var(--radius);
    border-bottom: 1px solid var(--line);
  }
  .flight:hover { background: var(--hover); }
  .flight .t { font-size: var(--text-big); font-weight: 500; }
  .flight .t sup { font-size: var(--text-meta); color: var(--muted); font-weight: 400; vertical-align: 0; margin-left: 2px; }
  .flight .tright { text-align: right; }
  .route { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
  .route .line { position: relative; height: 10px; }
  .route .line::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--faint); border-radius: 1px; }
  .route .dot { position: absolute; top: 1px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
  .route .dot.end { background: var(--ink); border-color: var(--ink); }
  .route .lbl { font-size: var(--text-meta); color: var(--muted); text-align: center; overflow-wrap: anywhere; }
  .flight .airline { overflow-wrap: anywhere; }
  .flight .price { text-align: right; font-size: var(--text-big); font-weight: 400; }
  .list > li:first-child .flight .price { font-weight: 600; }

  .gone-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: var(--space-3); row-gap: 2px; padding: var(--space-2) var(--space-3); border-radius: var(--radius); border-bottom: 1px solid var(--line); }
  .gone-row:hover, .gone-row.lit { background: var(--hover); }
  .gone-row .t, .gone-row .airline, .gone-row .price { color: var(--muted); }
  /* like the airline filter: the name and its price share a line that wraps, so a long name takes the full width and the price drops under it */
  .gone-row .aline { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--space-2); min-width: 0; }
  .gone-row .price { margin-left: auto; white-space: nowrap; text-align: right; }
  .gone-row .airline { overflow-wrap: anywhere; min-width: 0; }
  .gone-row .why { grid-column: 2; font-size: var(--text-meta); color: var(--muted); overflow-wrap: anywhere; }
  .gone-row .why b { font-weight: 500; color: var(--ink); }
  .gone-row .why b.now { color: var(--accent); }

  .trace .what .nw { white-space: nowrap; }
  main.searching .removed, main.searching #stepno, main.searching #gone-count, main.searching .trace .what, main.searching #filters-sum { visibility: hidden; }
  /* the two lists run the full height, so the column dividers reach the bottom together */
  .results, .gone { align-self: stretch; }
  .empty { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }
  .empty[hidden] { display: none; }
  .list:empty { display: none; }

  .status[hidden] { display: none; }
  .status { display: flex; align-items: center; gap: var(--space-3); min-height: 20px; }
  .bar { position: relative; flex: 1; max-width: 160px; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
  .bar i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(0); }

  .tabs { display: none; }
  .filters-toggle { display: none; }

  @media (max-width: 1180px) and (min-width: 901px) {
    :root { --filters-w: 260px; --left-w: 300px; }
    .flight { grid-template-columns: 68px minmax(100px, 1fr) 84px 84px; }
    .flight .airline-cell { display: none; }
  }

  /* ---------- phone ---------- */
  @media (max-width: 900px) {
    .top { flex-wrap: wrap; padding: var(--space-3) var(--space-4); }
    .trip { flex-basis: 100%; }
    main { display: flex; flex-direction: column; align-items: stretch; }
    .filters-toggle { order: 1; display: flex; margin: var(--space-3) var(--space-4) 0; justify-content: space-between; }
    .filters { order: 2; }
    .tabs { order: 3; }
    .results { order: 4; }
    .gone { order: 5; }
    .filters { position: static; max-height: none; border: 0; overflow: visible; padding: var(--space-4); }
    .results, .gone { min-height: 0; }
    .rhead { position: static; }
    .filters[data-open="false"] { display: none; }
    .filters-head { display: none; }
    .rhead { padding: var(--space-3) var(--space-4); }
    .tabs { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4) 0; }
    .tabs .btn { flex: 1; }
    .gone, .results { border: 0; }
    .gone .rhead { display: none; }
    main[data-tab="fit"] .gone { display: none; }
    main[data-tab="gone"] .results .list, main[data-tab="gone"] .results .empty { display: none; }
    .flight .t { white-space: nowrap; }
    .flight { grid-template-columns: 76px minmax(0, 1fr) 100px; grid-template-areas: "dep route arr" "air air price"; row-gap: var(--space-1); column-gap: var(--space-3); padding: var(--space-3) var(--space-2); }
    .flight .dep { grid-area: dep; }
    .flight .route { grid-area: route; }
    .flight .arr { grid-area: arr; }
    .flight .airline-cell { grid-area: air; }
    .flight .price { grid-area: price; }
    .list { padding: var(--space-2) var(--space-2) var(--space-4); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="trip">
      <h1 id="route-title">Denver to Lisbon</h1>
      <span class="meta" id="trip-meta">Fri 14 Nov, 1 adult (a made-up example)</span>
    </div>
    <div class="chrome" data-ui-chrome role="group" aria-label="Data">
      <button type="button" data-set="demo" aria-pressed="true">Demo data</button>
      <button type="button" data-set="worst" aria-pressed="false">Worst case</button>
      <button type="button" data-set="empty" aria-pressed="false">Empty</button>
    </div>
  </header>

  <main id="main" data-tab="fit">
    <button class="btn filters-toggle" id="filters-toggle" data-ui-disclosure aria-expanded="false" aria-controls="filters"><span>Filters</span><span class="meta num" id="filters-sum"></span></button>

    <aside class="filters" id="filters" data-open="false" aria-label="Filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="btn" id="reset">Reset</button>
      </div>

      <section class="fgroup" data-key="stops">
        <div class="fhead"><h3>Stops</h3><span class="removed num" data-ui-number></span></div>
        <div class="seg" id="stops" role="radiogroup" aria-label="Stops">
          <button class="btn" role="radio" data-v="any">Any</button>
          <button class="btn" role="radio" data-v="0">Nonstop</button>
          <button class="btn" role="radio" data-v="1">1 stop or fewer</button>
        </div>
      </section>

      <section class="fgroup" data-key="depart">
        <div class="fhead"><h3>Departs</h3><span class="removed num" data-ui-number></span></div>
        <div class="fvalue num" data-value></div>
        <div class="range" data-range="depart"><div class="track"></div><div class="inner"><div class="fill"></div><div class="thumb" role="slider" tabindex="0" data-end="0" aria-label="Departs after"></div><div class="thumb" role="slider" tabindex="0" data-end="1" aria-label="Departs before"></div></div></div>
      </section>

      <section class="fgroup" data-key="arrive">
        <div class="fhead"><h3>Arrives</h3><span class="removed num" data-ui-number></span></div>
        <div class="fvalue num" data-value></div>
        <div class="range" data-range="arrive"><div class="track"></div><div class="inner"><div class="fill"></div><div class="thumb" role="slider" tabindex="0" data-end="0" aria-label="Arrives after"></div><div class="thumb" role="slider" tabindex="0" data-end="1" aria-label="Arrives before"></div></div></div>
      </section>

      <section class="fgroup" data-key="price">
        <div class="fhead"><h3>Price</h3><span class="removed num" data-ui-number></span></div>
        <div class="fvalue num" data-value></div>
        <div class="range" data-range="price"><div class="track"></div><div class="inner"><div class="fill"></div><div class="thumb" role="slider" tabindex="0" data-end="1" aria-label="Highest price"></div></div></div>
      </section>

      <section class="fgroup" data-key="airlines">
        <div class="fhead"><h3>Airlines</h3><span class="removed num" data-ui-number></span></div>
        <ul class="airlines" id="airlines"></ul>
      </section>
    </aside>

    <section class="results" aria-label="Flights that fit">
      <div class="rhead">
        <div class="rhead-row">
          <h2 id="fit-title" class="num">Flights</h2>
          <span class="meta">Cheapest first</span>
        </div>
        <div class="trace">
          <span class="tipwrap">
            <button class="btn icon" id="back" data-ui-step="back" aria-label="Step back" aria-describedby="tip-back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            </button>
            <span class="tip" role="tooltip" id="tip-back">Step back, ⌘Z</span>
          </span>
          <span class="tipwrap">
            <button class="btn icon" id="forward" data-ui-step="forward" aria-label="Step forward" aria-describedby="tip-forward">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            </button>
            <span class="tip" role="tooltip" id="tip-forward">Step forward, ⇧⌘Z</span>
          </span>
          <span class="what" id="what" aria-live="polite"></span>
          <span class="meta num" id="stepno"></span>
        </div>
        <div class="status" id="status" hidden><span class="meta" id="status-text"></span><span class="bar"><i id="status-bar"></i></span></div>
      </div>
      <ol class="list" id="fit-list"></ol>
      <div class="empty" id="empty" hidden>
        <h3>No flight fits</h3>
        <span class="meta" id="empty-why"></span>
        <button class="btn" id="empty-back">Step back</button>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Lists">
      <button class="btn" role="tab" data-tab="fit" aria-selected="true" id="tab-fit">Fit</button>
      <button class="btn" role="tab" data-tab="gone" aria-selected="false" id="tab-gone">Left the list</button>
    </div>

    <section class="gone" aria-label="Flights that left the list">
      <div class="rhead">
        <div class="rhead-row"><h2>Left the list</h2><span class="meta num" id="gone-count"></span></div>
      </div>
      <ol class="list" id="gone-list"></ol>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- motion: motion-kit whimsical, as springs ---------- */

    if (els.main.classList.contains("searching")) searching(true); // keep the new counts for when the search ends
    els.empty.hidden = fit.length > 0;
    if (!fit.length) {
      var most = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })[0];
      els.emptyWhy.textContent = NAMES[most] + " removed " + plural(c[most], "flight", "flights") + ", the most of any filter.";
      $("empty-back").disabled = set.current === 0;
    }

    // trace line: which change, and what it moved
    var moved = 0, back = 0;
    before.forEach(function (b, id) {
      var nowList = rows.get(id).parentNode === els.fit ? "fit" : "gone";
      if (b.list !== nowList) { if (nowList === "gone") moved++; else back++; }
    });
    if (!animate) { // first paint: count against no filters
      moved = 0; back = 0;
    }
    var label = stepLabel(set.current ? set.steps[set.current - 1] : null, f);
    var tail = "";
    if (animate && (moved || back)) {
      tail = [moved ? plural(moved, "flight left", "flights left") : "", back ? plural(back, "came back", "came back") : ""].filter(Boolean).join(", ");
    } else if (!animate && set.current > 0) {
      var p = set.steps[set.current - 1], pf = 0, nf = 0;
      set.flights.forEach(function (fl) { var a = fails(p, fl).length === 0, b = fails(f, fl).length === 0; if (a && !b) pf++; if (!a && b) nf++; });
      tail = [pf ? plural(pf, "flight left", "flights left") : "", nf ? plural(nf, "came back", "came back") : ""].filter(Boolean).join(", ");
    }
    if (!tail && set.current) tail = "The list did not change";
    // each part of the tail stays on one line, so a count never sits alone at a line end
    var tailHTML = tail.split(", ").map(function (t) { return '<span class="nw">' + esc(t) + "</span>"; }).join(", ");
    els.what.innerHTML = (set.current ? "<b>" + esc(label) + "</b>" : esc(label)) + (tail ? ". " + tailHTML : "");
    els.stepno.textContent = (set.current + 1) + " of " + set.steps.length;
    els.back.disabled = set.current === 0;
    els.forward.disabled = set.current === set.steps.length - 1;

    if (animate && !reduce) flip(before);
  }

  function flip(before) {
    var enters = 0;
    rows.forEach(function (li, id) {
      var b = before.get(id); if (!b || !li.isConnected) return;
      var list = li.parentNode === els.fit ? "fit" : "gone", r = li.getBoundingClientRect();
      if (b.list === list) {
        var dy = b.r.top - r.top;
        if (Math.abs(dy) > 1) li.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: M.move.ms, easing: M.move.ease });
      } else {
        // it changed lists: it arrives from the side it came from
        var dx = list === "gone" ? -32 : 32, delay = Math.min(enters, 8) * STAGGER;
        enters++;
        if (r.bottom < 0 || r.top > innerHeight) return;
        li.animate([{ transform: "translateX(" + dx + "px) scale(.96)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: M.enter.ms, easing: M.enter.ease, delay: delay, fill: "backwards" });
      }
    });
  }

  /* ---------- hover: a filter lights the flights it removed; a removed flight lights its filters ---------- */
  function light(keys, ids) {
    [].forEach.call(document.querySelectorAll(".fgroup"), function (g) { g.classList.toggle("lit", keys.indexOf(g.dataset.key) >= 0); });
    [].forEach.call(els.gone.querySelectorAll(".gone-row"), function (r) {
      var why = (r.parentNode.dataset.why || "").split(" ");
      r.classList.toggle("lit", ids === "byKey" && keys.some(function (k) { return why.indexOf(k) >= 0; }));
    });
  }
  els.filters.addEventListener("pointerover", function (e) { var g = e.target.closest(".fgroup"); if (g) light([g.dataset.key], "byKey"); });
  els.filters.addEventListener("pointerleave", function () { light([], null); });
  els.gone.addEventListener("pointerover", function (e) { var li = e.target.closest("li"); if (li) light((li.dataset.why || "").split(" "), null); });
  els.gone.addEventListener("pointerleave", function () { light([], null); });

  /* ---------- phone: filters disclosure and list tabs ---------- */
  els.filtersToggle.addEventListener("click", function () {
    var open = els.filters.dataset.open !== "true";
    els.filters.dataset.open = open ? "true" : "false";
    els.filtersToggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  [els.tabFit, els.tabGone].forEach(function (b) {
    b.addEventListener("click", function () {
      els.main.dataset.tab = b.dataset.tab;
      [els.tabFit, els.tabGone].forEach(function (o) { var on = o === b; o.setAttribute("aria-selected", on ? "true" : "false"); });
    });
  });

  /* ---------- searching: a status row while fares come back, then rows arrive with no bounce ---------- */
  var searchTimer = null;
  // While fares come back, no count claims a list that is not on screen.
  function searching(on) {
    els.main.classList.toggle("searching", on);
    if (on) {
      [els.fitTitle, els.tabFit, els.tabGone].forEach(function (e) { delete e.dataset.done; });
      els.fitTitle.dataset.done = els.fitTitle.textContent; els.fitTitle.textContent = "Flights";
      els.tabFit.dataset.done = els.tabFit.textContent; els.tabFit.textContent = "Fit";
      els.tabGone.dataset.done = els.tabGone.textContent; els.tabGone.textContent = "Left the list";
    } else {
      [els.fitTitle, els.tabFit, els.tabGone].forEach(function (e) { if (e.dataset.done) { e.textContent = e.dataset.done; delete e.dataset.done; } });
    }
  }
  function search(then) {
    clearTimeout(searchTimer);
    if (!els.main.classList.contains("searching")) searching(true);
    els.status.hidden = false;
    els.statusText.textContent = "Checking " + plural(set.airlines.length, "airline", "airlines");
    els.statusBar.style.transition = "none"; els.statusBar.style.transform = "scaleX(0)";
    els.fit.style.visibility = "hidden"; els.gone.style.visibility = "hidden";
    requestAnimationFrame(function () {
      els.statusBar.style.transition = "transform 600ms linear"; els.statusBar.style.transform = "scaleX(1)";
    });
    searchTimer = setTimeout(function () {
      els.status.hidden = true;
      els.fit.style.visibility = ""; els.gone.style.visibility = "";
      searching(false);
      then();
    }, 650);
  }
  function arrive() {
    if (reduce) return;
    [].slice.call(els.fit.children, 0, 10).concat([].slice.call(els.gone.children, 0, 10)).forEach(function (li, i) {
      li.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: M.calm.ms, easing: M.calm.ease, delay: (i % 10) * STAGGER, fill: "backwards" });
    });
  }

  /* ---------- load a data set (demo chrome) ---------- */
  function load(name, withSearch) {
    setName = name;
    set = DATA[name]();
    maxPrice = Math.max.apply(null, set.flights.map(function (f) { return f.price; }));
    minPrice = Math.floor(Math.min.apply(null, set.flights.map(function (f) { return f.price; })) / 10) * 10;
    // a step at "any price" means the most expensive fare
    set.steps.forEach(function (s) { if (s.price > maxPrice) s.price = maxPrice; });
    $("route-title").textContent = set.title;
    $("trip-meta").textContent = set.meta;
    document.title = set.title;
    rows.forEach(function (li) { li.remove(); });
    rows = new Map();
    set.flights.forEach(function (fl) { rows.set(fl.id, makeRow(fl)); });
    buildAirlines();
    shownCounts = {};
    root.classList.add("no-move");
    update(set.current ? set.steps[set.current - 1] : null, false);
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove("no-move"); }); });
    [].forEach.call(document.querySelectorAll("[data-set]"), function (b) { b.setAttribute("aria-pressed", b.dataset.set === name ? "true" : "false"); });
    if (withSearch) search(arrive);
  }
  [].forEach.call(document.querySelectorAll("[data-set]"), function (b) {
    b.addEventListener("click", function () {
      var u = new URL(location.href);
      if (b.dataset.set === "demo") u.searchParams.delete("data"); else u.searchParams.set("data", b.dataset.set);
      history.replaceState(null, "", u);
      load(b.dataset.set, true);
    });
  });

  load(setName, true);

  window.flightSearch = {
    snapshot: function () {
      return { step: set.current + 1, of: set.steps.length, change: els.what.textContent, fit: els.fit.children.length, left: els.gone.children.length, stops: F().stops, price: F().price };
    },
    loading: function () { clearTimeout(searchTimer); if (!els.main.classList.contains("searching")) searching(true); els.status.hidden = false; els.statusText.textContent = "Checking " + plural(set.airlines.length, "airline", "airlines"); els.statusBar.style.transition = "none"; els.statusBar.style.transform = "scaleX(0.55)"; els.fit.style.visibility = "hidden"; els.gone.style.visibility = "hidden"; },
    light: function (key) { light([key], "byKey"); }
  };
})();
</script>
<style>
  .no-move *, .no-move *::before, .no-move *::after { transition: none !important; }
</style>
</body>
</html>
