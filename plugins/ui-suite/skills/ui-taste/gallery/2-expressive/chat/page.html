<head>

</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap">
<style>
  /* ---------- Tokens: colour (draw: warm black, gold) ---------- */
  :root {
    --bg: #f4f2ee;
    --surface: #e9e6e0;
    --mine: #dfdad2;
    --ink: #1c1814;
    --muted: #6b645c;
    --line: #e0dcd4;
    --hover: #ebe8e2;
    --accent: #c9a45a;
    --accent-ink: #0c0a08;
    --accent-text: #7f6126;
    --tip-bg: #1c1814;
    --tip-ink: #f4f2ee;
    --shadow: 0 6px 20px rgba(28, 24, 20, 0.12);
    --sel-bg: #e9e6e0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a08;
      --surface: #181512;
      --mine: #26211b;
      --ink: #ffffff;
      --muted: #8f8a84;
      --line: #221e19;
      --hover: #141210;
      --accent: #c9a45a;
      --accent-ink: #0c0a08;
      --accent-text: #c9a45a;
      --tip-bg: #2c2620;
      --tip-ink: #ffffff;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      --sel-bg: #27221c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a08;
    --surface: #181512;
    --mine: #26211b;
    --ink: #ffffff;
    --muted: #8f8a84;
    --line: #221e19;
    --hover: #141210;
    --accent: #c9a45a;
    --accent-ink: #0c0a08;
    --accent-text: #c9a45a;
    --tip-bg: #2c2620;
    --tip-ink: #ffffff;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    --sel-bg: #27221c;
    color-scheme: dark;
  }

  /* ---------- Tokens: type, space, radius, motion ---------- */
  :root {
    --font: "Clash Grotesk", system-ui, sans-serif;
    --t-title: 24px;
    --t-head: 18px;
    --t-body: 14px;
    --t-meta: 13px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --r-row: 10px;
    --r-bubble: 16px;
    --r-btn: 8px;
    --row-pad: 10px;
    /* whimsical feel; JS writes the spring curves */
    --tap: 270ms; --tap-touch: ease-out; --fade: 150ms;
  }

  /* ?font=system swaps the draw's face for the lint policy's system face, to lint everything else */
  :root[data-font="system"] { --font: system-ui, sans-serif; }

  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); height: 100%; }
  body { margin: 0; height: 100%; font: 400 var(--t-body)/1.4 var(--font); background: var(--bg); overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  h1, h2, p { margin: 0; }

  .app {
    display: grid;
    grid-template-columns: clamp(280px, 26%, 420px) minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- List pane ---------- */
  .list-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: var(--s4) var(--s4) var(--s2); }
  .list-head h1 { font-size: var(--t-title); font-weight: 600; letter-spacing: 0.01em; }
  .search { position: relative; margin: 0 var(--s4) var(--s2); }
  .search svg { position: absolute; left: 10px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 var(--s3) 0 34px;
    border: 1px solid transparent; border-radius: var(--r-btn);
    background: var(--surface); font-size: var(--t-body); outline: none;
    -webkit-appearance: none; appearance: none;
    transition: border-color var(--fade) ease-out;
  }
  .search input::placeholder { color: var(--muted); opacity: 1; }
  .search input:focus-visible { border-color: var(--accent); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }

  .list-scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: var(--s1) var(--s2) 72px; overscroll-behavior: contain; }
  /* the list fades over its last 48 px, so a row cut by the pane edge reads as more below */
  .list-scroll { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 48px), transparent); }
  .sel { position: absolute; left: var(--s2); right: var(--s2); top: 0; height: 0; border-radius: var(--r-row); background: var(--sel-bg); opacity: 0; pointer-events: none; }
  .list { position: relative; list-style: none; margin: 0; padding: 0; }
  .row { position: relative; border-radius: var(--r-row); }
  .row[hidden] { display: none; }
  .row-main {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s3); row-gap: 2px;
    width: 100%; min-height: 56px; padding: var(--row-pad) var(--s3);
    border: 0; border-radius: var(--r-row); background: transparent; text-align: left; cursor: pointer;
    transition: background-color var(--fade) ease-out, transform var(--tap) var(--tap-touch);
  }
  .row:hover .row-main { background: var(--hover); }
  .row.is-open:hover .row-main { background: transparent; }
  .row-main:active { transform: scale(0.98); }
  .row-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .name { font-weight: 400; overflow-wrap: anywhere; min-width: 0; }
  .time { color: var(--muted); font-size: var(--t-meta); white-space: nowrap; align-self: start; padding-top: 1px; transition: opacity var(--fade) ease-out; }
  .preview { color: var(--muted); font-size: var(--t-meta); overflow-wrap: anywhere; min-width: 0; }
  /* The slot keeps the badge's height, so a badge leaving never shrinks its row and snaps the rows below. */
  .badge-slot { display: flex; align-items: center; justify-content: flex-end; min-width: 20px; min-height: 22px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px;
    background: var(--accent); color: var(--accent-ink);
    font-size: var(--t-meta); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .row.unread .name { font-weight: 600; }
  .row.unread .preview { color: var(--ink); }

  .icon-btn.row-act {
    position: absolute; right: 10px; top: 8px; width: 24px; height: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity var(--fade) ease-out, transform var(--tap) var(--tap-touch);
  }
  .row:hover .row-act, .row-act:focus-visible { opacity: 1; pointer-events: auto; }
  .row-act:focus-visible { outline-offset: -2px; }
  .row:hover .time, .row:focus-within .time { opacity: 0; }

  .empty { padding: var(--s4) var(--s3); color: var(--muted); font-size: var(--t-meta); }
  .made-up { padding: var(--s3) var(--s3) 0; color: var(--muted); font-size: var(--t-meta); }

  /* ---------- Icon buttons and tooltips ---------- */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--r-btn);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface); color: var(--ink); }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .tipwrap { position: relative; display: inline-flex; }
  .tip {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    background: var(--tip-bg); color: var(--tip-ink); font-size: var(--t-meta);
    visibility: hidden; opacity: 0; pointer-events: none;
    transition: opacity var(--fade) ease-out, visibility 0s linear var(--fade);
  }
  .tipwrap:hover .tip, .tipwrap:has(:focus-visible) .tip, .row-act:hover + .tip, .row-act:focus-visible + .tip {
    visibility: visible; opacity: 1; transition: opacity var(--fade) ease-out 300ms, visibility 0s;
  }
  .row .tip { top: 6px; right: 40px; }

  /* ---------- Reading pane ---------- */
  .thread-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .thread-head { display: flex; align-items: center; gap: var(--s3); min-height: 64px; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line); }
  .thread-head .back { display: none; }
  .who { min-width: 0; }
  .who h2 { font-size: var(--t-head); font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
  .who p { color: var(--muted); font-size: var(--t-meta); min-height: 1lh; }
  .thread-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column-reverse; overscroll-behavior: contain; }
  .thread { display: flex; flex-direction: column; padding: var(--s4) var(--s5) var(--s2); }

  /* the day label pins to the top of the thread while its messages scroll, so every time reads with its day */
  .day { position: sticky; top: 0; z-index: 1; align-self: center; min-width: 220px; margin: var(--s4) 0 var(--s2); padding: var(--s1) var(--s3); text-align: center; background: var(--bg); color: var(--muted); font-size: var(--t-meta); }
  /* Clash Grotesk does not stack Vietnamese marks; text in Vietnamese uses the system face */
  :lang(vi) { font-family: system-ui, sans-serif; }
  .new-line { display: flex; align-items: center; gap: var(--s2); margin: var(--s3) 0 var(--s1); color: var(--accent-text); font-size: var(--t-meta); font-weight: 500; }
  .new-line::after { content: ""; flex: 1; height: 1px; background: var(--accent); opacity: 0.5; }

  .msg { display: flex; flex-direction: column; align-items: flex-start; max-width: min(64%, 620px); margin-top: 2px; }
  .msg.first { margin-top: var(--s3); }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .sender { color: var(--muted); font-size: var(--t-meta); margin: 0 var(--s3) 2px; overflow-wrap: anywhere; }
  .bubble {
    padding: 8px 12px; border-radius: var(--r-bubble); background: var(--surface);
    overflow-wrap: anywhere; white-space: pre-wrap; max-width: 100%;
  }
  .msg.me .bubble { background: var(--mine); }
  .msg .stamp { color: var(--muted); font-size: var(--t-meta); margin: 2px var(--s3) 0; }
  .bubble.emoji { background: transparent; padding: 0 4px; font-size: 32px; line-height: 1.2; }

  .typing .bubble { display: inline-flex; gap: 4px; align-items: center; height: 36px; padding: 0 14px; }
  .typing .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--muted); animation: dot 1.1s ease-in-out infinite; }
  .typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .compose { display: flex; align-items: flex-end; gap: var(--s2); padding: var(--s3) var(--s5) var(--s4); }
  .compose textarea {
    flex: 1; min-width: 0; min-height: 40px; max-height: 140px; resize: none;
    padding: 9px 14px; border: 1px solid transparent; border-radius: 20px;
    background: var(--surface); font-size: var(--t-body); line-height: 1.4; outline: none; caret-color: var(--accent);
    -webkit-appearance: none; appearance: none;
    transition: border-color var(--fade) ease-out;
  }
  .compose textarea::placeholder { color: var(--muted); opacity: 1; }
  .compose textarea:focus-visible { border-color: var(--accent); }
  .send {
    width: 40px; height: 40px; border-radius: 20px; background: var(--accent); color: var(--accent-ink);
    transition: transform var(--tap) var(--tap-touch), opacity var(--fade) ease-out;
  }
  .send:hover { background: var(--accent); color: var(--accent-ink); }
  .send:disabled { opacity: 0.4; cursor: default; }
  .send:disabled:active { transform: none; }
  .compose .tip { top: auto; bottom: calc(100% + 6px); }

  /* ---------- Data toggle (break-ui chrome, not part of the design) ---------- */
  .data-toggle {
    position: fixed; left: 16px; bottom: 16px; z-index: 30;
    display: flex; gap: 8px; padding: 4px; border-radius: 10px;
    background: #e4e4e7; font: 400 13px/1 system-ui, -apple-system, sans-serif; color: #18181b;
  }
  .data-toggle button { white-space: nowrap; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; font: inherit; color: #3f3f46; cursor: pointer; }
  .data-toggle button[aria-pressed="true"] { background: #ffffff; color: #18181b; }

  /* ---------- Phone: one pane at a time ---------- */
  @media (max-width: 767px) {
    .app { grid-template-columns: minmax(0, 1fr); position: relative; }
    .list-pane { border-right: 0; }
    .thread-pane { position: absolute; inset: 0; z-index: 10; visibility: hidden; }
    .app.thread-open .thread-pane { visibility: visible; }
    .thread-head { padding: var(--s2) var(--s3); min-height: 56px; }
    .thread-head .back { display: inline-flex; }
    .thread { padding: var(--s3) var(--s3) var(--s2); }
    .compose { padding: var(--s2) var(--s3) var(--s3); }
    .msg { max-width: 82%; }
    .sel { display: none; }
    .data-toggle { left: 50%; transform: translateX(-50%); }
    .app.thread-open ~ .data-toggle { display: none; }
    .row-act { display: none; }
    .row:hover .time, .row:focus-within .time { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .typing .dot { animation: none; opacity: 0.8; }
    .row-main:active, .icon-btn:active { transform: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="list-pane" data-ui-pane="list" aria-label="Chats">
    <div class="list-head">
      <h1>Chats</h1>
    </div>
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
      <input id="search" type="search" placeholder="Search" aria-label="Search chats" autocomplete="off">
    </div>
    <div class="list-scroll" id="list-scroll">
      <div class="sel" id="sel"></div>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden></p>
      <p class="made-up">(a made-up example)</p>
    </div>
  </aside>

  <main class="thread-pane" id="thread-pane" data-ui-pane="reading">
    <header class="thread-head">
      <span class="tipwrap back">
        <button class="icon-btn" id="back" type="button" aria-label="Back to chats" aria-describedby="tip-back">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
        </button>
        <span class="tip" role="tooltip" id="tip-back" style="left:0;right:auto">Chats</span>
      </span>
      <div class="who">
        <h2 id="who-name" dir="auto"></h2>
        <p id="who-meta"></p>
      </div>
    </header>
    <div class="thread-scroll" id="thread-scroll">
      <div class="thread" id="thread" aria-live="polite" data-ui-ragged></div>
    </div>
    <form class="compose" id="compose" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <span class="tipwrap">
        <button class="icon-btn send" id="send" type="submit" aria-label="Send" aria-describedby="tip-send" disabled>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
        </button>
        <span class="tip" role="tooltip" id="tip-send">Send</span>
      </span>
    </form>
  </main>
</div>

<div class="data-toggle" data-ui-chrome role="group" aria-label="Data set">
  <button type="button" data-set="demo">Demo data</button>
  <button type="button" data-set="worst">Worst case</button>
</div>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var reduceQuery = matchMedia("(prefers-reduced-motion: reduce)");
  var phoneQuery = matchMedia("(max-width: 767px)");
  function reduced() { return reduceQuery.matches; }
  function $(id) { return document.getElementById(id); }

  /* ---------- Feel: whimsical, from motion-kit defaults.js ----------
     tap 0.15/0.35 (amount 0.95), enter 0.48/0.35, exit 0.29/0, move 0.48/0.35,
     attention 0.38/0.35 (amount 1.1), stagger 0.065, reduced fade 0.15.
     The spring is Motion's mapping from (visualDuration, bounce); the curve runs
     for 1.8 x the visual duration as a CSS linear() easing. Bounce only answers a
     touch: a move no touch started gets bounce 0. */
  var FEEL = { tap: [0.15, 0.35], enter: [0.48, 0.35], exit: [0.29, 0], move: [0.48, 0.35], attention: [0.38, 0.35] };
  var ATTENTION_AMOUNT = 1.1, STAGGER = 65, FADE = 150;
  var curves = {}, points = {};
  function springPoints(v, b) {
    var key = v + "/" + b;
    if (points[key]) return points[key];
    var w0 = (2 * Math.PI) / (1.2 * v), z = Math.max(1 - b, 0.05), T = 1.8 * v, n = 48, pts = [];
    for (var i = 0; i <= n; i++) {

      else { x = Math.exp(-w0 * t) * (1 + w0 * t); }

    var key = v + "/" + b;
    return curves[key] || (curves[key] = "linear(" + springPoints(v, b).join(", ") + ")");

  function spring(kind, touch) {
    var f = FEEL[kind];

  // size for good, in ms. Text that waits for its box starts showing here.

    var prev = last(c);
    var m = { who: "me", text: text, t: Date.now() };
    c.msgs.push(m);
    var el = msgEl(c, m, prev && dayLabel(prev.t) === dayLabel(m.t) ? prev : null);
    el._t = m.t;
    var d = null;
    if (!prev || dayLabel(prev.t) !== "Today") {
      d = document.createElement("div");
      d.className = "day";
      d.textContent = "Today";
      threadEl.insertBefore(d, threadEl.querySelector(".typing"));
    }
    threadEl.insertBefore(el, threadEl.querySelector(".typing"));
    restampSoft(spring("enter", false));
    threadScroll.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
    if (d) growDay(d);
    growIn(el, true);
    renderList("touch");
    expectReply(c);
  }

  function expectReply(c) {
    clearTimeout(c.timer);
    c.timer = setTimeout(function () {
      c.typing = true;
      if (state.open === c.id && !threadEl.querySelector(".typing")) {
        var t = typingEl(c);
        threadEl.appendChild(t);
        growIn(t, false);
      }
      c.timer = setTimeout(function () { land(c); }, 1400);
    }, 600);
  }

  function land(c) {
    c.timer = null;
    c.typing = false;
    var r = c.replies[c.replyAt % c.replies.length];
    c.replyAt++;
    var prev = last(c);
    var m = { who: r[0], text: r[1], t: Date.now() };
    c.msgs.push(m);
    if (state.open === c.id && (!phoneQuery.matches || app.classList.contains("thread-open"))) {
      var t = threadEl.querySelector(".typing");
      var el = msgEl(c, m, prev);
      el._t = m.t;
      if (t) morph(t, el); else { threadEl.appendChild(el); restampSoft(spring("enter", false)); growIn(el, false); }
    } else {
      c.unread += 1;
      var t2 = state.open === c.id && threadEl.querySelector(".typing");
      if (t2) t2.remove();
    }
    renderList("quiet");
  }

  // The typing bubble becomes the reply: same object, new size. The words wait
  // for the box: they fade in only once the bubble is big enough to hold them.
  function morph(t, el) {
    var bubble = t.querySelector(".bubble");
    var r0 = bubble.getBoundingClientRect();
    var h0 = t.offsetHeight;
    var nb = el.querySelector(".bubble");
    t.className = el.className;
    bubble.className = nb.className;
    bubble.removeAttribute("aria-label");
    bubble.dir = nb.dir;
    if (nb.lang) bubble.lang = nb.lang; else bubble.removeAttribute("lang");
    bubble.textContent = nb.textContent;
    bubble.title = nb.title;
    t._t = el._t;
    if (!el.querySelector(".sender")) { var s = t.querySelector(".sender"); if (s) s.remove(); }
    var feel = spring("enter", false);
    // The reply's time joins the target height, so the slot opens once, fully.
    restampSoft(feel);
    if (reduced()) { fadeIn(bubble); return; }
    var r1 = bubble.getBoundingClientRect();
    var h1 = t.offsetHeight;
    var cs = getComputedStyle(bubble);
    var inner = document.createElement("span");
    inner.style.display = "block";
    inner.style.width = (r1.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + "px";
    inner.textContent = bubble.textContent;
    bubble.textContent = "";
    bubble.appendChild(inner);
    t.animate([{ height: h0 + "px" }, { height: h1 + "px" }], feel);
    var a = bubble.animate([{ width: r0.width + "px", height: r0.height + "px" }, { width: r1.width + "px", height: r1.height + "px" }], feel);
    var gap = Math.max(r1.width - r0.width, r1.height - r0.height, h1 - h0, 0);
    var at = settledAt("enter", false, gap);
    var words = inner.animate([{ opacity: 0 }, { opacity: 1 }], { duration: FADE, delay: at, easing: "ease-out", fill: "backwards" });
    stampIn(t, at);
    // Unwrap only when both are done, so the words never rewrap mid-motion.
    var unwrap = function () { if (inner.parentNode === bubble) bubble.textContent = inner.textContent; };
    Promise.all([a.finished, words.finished]).then(unwrap, unwrap);
  }

  /* ---------- Search ---------- */
  $("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim();
    renderList("touch");
  });

  /* ---------- Data toggle (chrome) ---------- */
  function urlWith(extra) {
    var p = new URLSearchParams(location.search);
    Object.keys(extra).forEach(function (k) { if (extra[k] == null) p.delete(k); else p.set(k, extra[k]); });
    var s = p.toString();
    return location.pathname + (s ? "?" + s : "");
  }
  document.querySelectorAll(".data-toggle button").forEach(function (b) {
    var on = (b.dataset.set === "worst") === worst;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.addEventListener("click", function () {
      if (on) return;
      location.href = urlWith({ data: b.dataset.set === "worst" ? "worst" : null, chat: null });
    });
  });

  /* ---------- First paint ---------- */
  var asked = new URLSearchParams(location.search).get("chat");
  var startOpen = byId(asked) ? asked : (worst ? "w1" : "climb");
  state.open = startOpen;
  renderList("none");
  var first = byId(startOpen);
  if (first.unread > 0 && !phoneQuery.matches) { renderThread(first, "none"); first.unread = 0; renderList("none"); }
  else renderThread(first, "none");
  phoneQuery.addEventListener("change", function () { app.classList.remove("thread-open"); renderList("none"); });
  addEventListener("resize", function () { placeSel(false); });

  // for drive.mjs checks
  window.__chat = {
    unread: function () { var o = {}; convos.forEach(function (c) { if (c.unread) o[c.id] = c.unread; }); return o; },
    order: function () { return ordered().map(function (c) { return c.id; }); },
    open: function () { return state.open; }
  };
})();
</script>
<script>
  // mark text that is Vietnamese, so :lang(vi) can give it a face that stacks its marks
  (function () {
    var VI = /[ăâđêôơưĂÂĐÊÔƠƯẠ-ỹ]/;
    function mark(root) {
      if (!root || root.nodeType !== 1) return;
      var els = root.matches('[dir="auto"]') ? [root] : [];
      root.querySelectorAll('[dir="auto"]').forEach(function (e) { els.push(e); });
      els.forEach(function (e) {
        var want = VI.test(e.textContent);
        if (want && e.lang !== "vi") e.lang = "vi"; else if (!want && e.lang === "vi") e.removeAttribute("lang");
      });
    }
    window.markLang = mark;
    mark(document.body);
    new MutationObserver(function (list) {
      list.forEach(function (m) {
        var t = m.target.nodeType === 1 ? m.target : m.target.parentElement;
        if (t) mark(t.closest('[dir="auto"]') || t);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  })();
</script>
