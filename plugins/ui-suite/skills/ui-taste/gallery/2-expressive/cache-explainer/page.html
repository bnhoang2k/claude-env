/* Tokens: colour (from the draw: Sky and navy) */
:root{
  --bg:#6bb4ee;--surface:#7dbdf0;--ink:#0e1822;--muted:#1b3d5c;--accent:#ff5a1f;--accent-ink:#0e1822;--hit:#0e1822;
  --line:rgba(14,24,34,.2);--line-strong:rgba(14,24,34,.55);--touch:rgba(14,24,34,.09);
  --shadow:0 1px 2px rgba(14,24,34,.12),0 6px 18px rgba(14,24,34,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1724;--surface:#12212f;--ink:#e6f1fb;--muted:#a3c4e0;--accent:#ff6a33;--accent-ink:#0b1724;--hit:#9fd0f5;
  --line:rgba(230,241,251,.14);--line-strong:rgba(230,241,251,.5);--touch:rgba(230,241,251,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1724;--surface:#12212f;--ink:#e6f1fb;--muted:#a3c4e0;--accent:#ff6a33;--accent-ink:#0b1724;--hit:#9fd0f5;
  --line:rgba(230,241,251,.14);--line-strong:rgba(230,241,251,.5);--touch:rgba(230,241,251,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;
}
/* Tokens: the figure's tones, tints of the same sky and navy */
.iso[data-theme="light"],.iso{
  --anatomy-card:var(--surface);--anatomy-paper:var(--surface);--anatomy-text:#1b3d5c;--anatomy-muted:#1b3d5c;
  --anatomy-face:#b4d9f7;--anatomy-top:#c4e1f9;
  --anatomy-shade-0:#5c9fd6;--anatomy-shade-1:#6aa9de;--anatomy-shade-2:#86bce8;--anatomy-shade-3:#9dcaf0;
  --anatomy-lit-top:#eef7ff;--anatomy-lit-shade:#d6eafb;
  --anatomy-hi:#0e1822;--anatomy-mid:#24496b;--anatomy-lo:#3f6b92;--anatomy-faint:#5b8cb8;--anatomy-lit:#0e1822;
  --anatomy-halo:#1b3d5c;--anatomy-halo-opacity:.35;--anatomy-dot:#0e1822;
  --anatomy-mono:var(--sans);
}
.iso[data-theme="dark"]{
  --anatomy-card:var(--surface);--anatomy-paper:var(--surface);--anatomy-text:#a3c4e0;--anatomy-muted:#a3c4e0;
  --anatomy-face:#1b3043;--anatomy-top:#203750;

  --anatomy-lit-top:#6a94bb;--anatomy-lit-shade:#4b7398;
  --anatomy-hi:#d4e6f6;--anatomy-mid:#6f90ae;--anatomy-lo:#45627e;--anatomy-faint:#2d455c;--anatomy-lit:#ffffff;
  --anatomy-halo:#000000;--anatomy-halo-opacity:.8;--anatomy-dot:#e6f1fb;

/* Tokens: type, space, shape */
:root{
  --serif:"Bodoni Moda",Georgia,serif;--sans:"Jost",system-ui,sans-serif;
  --t-meta:13px;--t-ui:14px;--t-body:16px;--t-title:24px;--t-hero:40px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-sm:6px;--r-md:10px;--row:32px;--dot:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 var(--t-body)/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{min-height:100vh;padding:var(--s5) var(--s6) 80px;display:grid;grid-template-rows:auto 1fr;gap:var(--s5)}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4) var(--s6);flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
h1{margin:0;font:500 var(--t-hero)/1.1 var(--serif);letter-spacing:-.01em}
.made-up{font-size:var(--t-meta);color:var(--muted)}
.stats{display:flex;gap:var(--s5);flex-wrap:wrap;margin:0;padding:0;list-style:none}
.stat{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-ui)}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
/* live.js reserves each number and word its widest width, so a total never shifts the row */
.stat b,.stat .k{display:inline-block}
.stat b{text-align:right}
.stat .k{color:var(--muted)}
.swatch{width:var(--dot);height:var(--dot);border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1.5px var(--ink)}
.swatch.hit,.dot.hit{background:var(--hit)}
.swatch.miss,.dot.miss{background:var(--accent)}

/* Main layout: requests, the figure with its step bar, the cache and the store */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:var(--s5);align-items:start;min-height:0}
.panel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);padding:var(--s4) var(--s4) var(--s2);flex-wrap:wrap}
h2{margin:0;font:600 18px/1.2 var(--sans)}
.panel-head span{font-size:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}

/* Request list */
.queue{max-height:calc(100vh - 210px)}
.qlist{list-style:none;margin:0;padding:0 var(--s2) var(--s2);overflow-y:auto;min-height:0;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:0 var(--s2);align-content:start}
.q{border-radius:var(--r-sm)}
.q button{width:100%;min-height:var(--row);display:grid;grid-template-columns:24px var(--dot) minmax(0,1fr) auto;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2);background:none;border:0;border-radius:var(--r-sm);text-align:left;cursor:pointer;font-size:var(--t-ui);transition:background-color .1s}
.q button:hover{background:var(--touch)}
.q .qn{color:var(--muted);font-variant-numeric:tabular-nums;font-size:var(--t-meta)}
.q .qk{overflow-wrap:anywhere;min-width:0}
.q .qk,.row .key{display:grid}
.q .qk>span,.row .key>span,.q .qk::after,.row .key::after{grid-area:1/1;min-width:0}
.q .qk::after,.row .key::after{content:attr(data-text);font-weight:600;visibility:hidden}
.q .qt{color:var(--muted);font-size:var(--t-meta);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:var(--dot);height:var(--dot);border-radius:50%;box-shadow:0 0 0 1.5px var(--ink)}
.q.future .dot,.q.future .qt{visibility:hidden}
.q.future .qk{color:var(--muted)}
.q.current{background:var(--touch)}
.q.current button,.q.current .qk{font-weight:600}

/* The figure */
.stage-col{display:grid;gap:var(--s4);min-width:0}
.fig{margin:0}
.fig .iso-plate{padding:40px var(--s4) 36px;border-radius:var(--r-md);box-shadow:var(--shadow)}
.fig .iso-plate-corners{inset:var(--s4) var(--s4) 14px}
.fig .iso-plate-corner{font-family:var(--sans);font-size:var(--t-meta);letter-spacing:0;text-transform:none;color:var(--muted)}
.fig .iso-plate-corner[data-corner="readout"]{color:var(--ink)}
/* Its own layer: the blurred halos otherwise re-raster a stray pixel or two while the page is still */
.stage svg{max-height:calc(100vh - 420px);min-height:180px;will-change:transform}
.fig-key{display:flex;gap:var(--s2) var(--s5);flex-wrap:wrap;margin:var(--s2) 0 0;padding:0;list-style:none;font-size:var(--t-meta);color:var(--muted)}
.fig-key b{font-weight:600;color:var(--ink)}

/* Step bar */
.stepbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s5);align-items:start;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:var(--s4) var(--s5)}
.controls{display:flex;gap:var(--s2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);min-height:36px;min-width:36px;padding:0 var(--s3) 0 var(--s2);background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:var(--t-ui);font-weight:500;cursor:pointer;transition:background-color .1s}
.btn.fwd{padding:0 var(--s2) 0 var(--s3)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:hover:not(:disabled){background:var(--touch)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.q button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.steptext{min-height:92px;min-width:0}
.stepno{margin:0;font-size:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.stephead{margin:2px 0 var(--s1);font:500 var(--t-title)/1.2 var(--serif);overflow-wrap:anywhere}
.stepbody{margin:0;max-width:72ch;overflow-wrap:anywhere}

/* Cache slots and store rows */
.side{display:grid;gap:var(--s5);min-width:0}
.slots{list-style:none;margin:0;padding:0 var(--s2)}
.slot{display:grid;grid-template-columns:minmax(0,1fr);align-items:baseline;align-content:start;gap:0;padding:var(--s2);border-top:1px solid var(--line);border-radius:var(--r-sm);transition:background-color .15s}
.slot:first-child{border-top-color:transparent}
.slot .key{font-weight:500;overflow-wrap:anywhere;min-width:0;font-size:var(--t-ui)}
.slot .val{order:1;font-size:var(--t-meta);color:var(--muted);overflow-wrap:anywhere}
.slot .used{order:2;font-size:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}
/* An empty slot keeps the value and "used" lines, so filling it moves nothing below */
.slot .val,.slot .used{min-height:1.45em}
.slot.empty .key{color:var(--muted);font-weight:400}
.slot.touched{background:var(--touch)}
.slot.touched .key,.row.touched .key{font-weight:600}
.evicted{min-height:2.9em;margin:var(--s1) var(--s4) var(--s3);font-size:var(--t-meta);color:var(--muted);overflow-wrap:anywhere}
.evicted s{color:var(--ink);text-decoration-thickness:1.5px}
.rows{position:relative;list-style:none;margin:0;padding:0 var(--s2) var(--s2);max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-items:baseline;min-height:var(--row);padding:var(--s1) var(--s2);border-radius:var(--r-sm);font-size:var(--t-ui);transition:background-color .15s}
.row .key{overflow-wrap:anywhere;min-width:0}
.row .val{color:var(--muted);font-size:var(--t-meta);overflow-wrap:anywhere}
.row.touched{background:var(--touch)}
.row.returned .key{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.rows::after{content:"";display:block;height:var(--tail,0px)}
.qlist.more,.rows.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 32px),transparent)}

/* Demo data / Worst case toggle (test chrome, not part of the design) */
.chrome{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;padding:4px;background:#e4e4e4;border-radius:999px;font:500 13px/1 system-ui,-apple-system,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chrome button{min-height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#222;cursor:pointer;font:inherit;white-space:nowrap}
.chrome button[aria-pressed="true"]{background:#fff}
.chrome button:focus-visible{outline:2px solid #222;outline-offset:1px}

/* Narrower desktops: the cache and store sit under the figure, side by side */
@media (max-width:1180px) and (min-width:861px){
  .layout{grid-template-columns:300px minmax(0,1fr)}
  .side{grid-column:2;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (min-width:600px) and (max-width:860px){.side{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
/* Phone */
@media (max-width:860px){
  .app{padding:var(--s4);gap:var(--s4)}
  .chrome{position:static;transform:none;width:max-content;margin:0 auto var(--s4)}
  h1{font-size:32px}
  .stats{gap:var(--s4)}
  .layout{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
  .stage-col{order:1}
  .side{order:2;gap:var(--s4)}
  .queue{order:3;max-height:360px}
  .fig .iso-plate{padding:36px var(--s2) 32px}
  .fig .iso-plate-corners{inset:var(--s3) var(--s3) 12px}
  .stage svg{max-height:none;min-height:0}

  .stepbar{grid-template-columns:minmax(0,1fr);gap:var(--s3);padding:var(--s3) var(--s4)}
  .steptext{min-height:140px}
  .stephead{font-size:20px}
}
.measuring *{transition:none!important}
@media (prefers-reduced-motion:reduce){.btn,.q button,.slot,.row{transition:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="title"><h1>How a cache answers</h1><span class="made-up">(a made-up example)</span></div>
  <ul class="stats" aria-label="Totals so far">
    <li class="stat"><span class="swatch hit"></span><b id="hits" data-ui-number>0</b><span class="k" id="hitsWord">hits</span></li>
    <li class="stat"><span class="swatch miss"></span><b id="misses" data-ui-number>0</b><span class="k" id="missesWord">misses</span></li>
    <li class="stat"><span class="k">Waited</span><b id="waited" data-ui-number>0 ms</b></li>
  </ul>
</header>
<main class="layout">
  <section class="panel queue" aria-labelledby="qh">
    <div class="panel-head"><h2 id="qh">Requests</h2><span id="qcount"></span></div>
    <ol class="qlist" id="qlist"></ol>
  </section>
  <section class="stage-col" aria-label="The cache at work">
    <figure class="fig iso"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">Pick and place</span><span class="iso-plate-corner" data-corner="readout" data-readout></span></div><div class="stage" id="stage" role="img" aria-label="A pick-and-place arm on a gantry, between a near rack of three slots and a far shelf. The rack is the cache; the shelf is the store, one block per key. The arm fetches blocks from the shelf, lifts them from the rack, and puts back the one used longest ago when the rack is full."></div></div>
      <figcaption><ul class="fig-key"><li><b>Left</b> the cache</li><li><b>Right</b> the store</li></ul></figcaption>
    </figure>
    <div class="stepbar">
      <div class="controls">
        <button class="btn" type="button" id="back" data-ui-step="back" aria-keyshortcuts="ArrowLeft"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
        <button class="btn fwd" type="button" id="next" data-ui-step="forward" aria-keyshortcuts="ArrowRight">Next<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="steptext" aria-live="polite"><p class="stepno" id="stepno"></p><p class="stephead" id="stephead"></p><p class="stepbody" id="stepbody"></p></div>
    </div>
  </section>
  <aside class="side">
    <section class="panel cache" aria-labelledby="ch">
      <div class="panel-head"><h2 id="ch">Cache</h2><span id="cacheCost"></span></div>
      <ul class="slots" id="slots"></ul>
      <div class="evicted" id="evicted" aria-live="polite"></div>
    </section>
    <section class="panel store" aria-labelledby="sh">
      <div class="panel-head"><h2 id="sh">Store</h2><span id="storeCost"></span></div>
      <ul class="rows" id="rows"></ul>
    </section>
  </aside>
</main>
</div>
<div class="chrome" data-ui-chrome role="group" aria-label="Data set">
  <button type="button" data-set="demo">Demo data</button>
  <button type="button" data-set="worst">Worst case</button>
  <button type="button" data-set="empty">Empty</button>
</div>

<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {

    for (let index = 0; index < points.length; index++) {

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {

        lower.push(point);

    }

const FIGURE_OF = {"demo":"demo","empty":"demo","worst":"worst"};
const FIGS = {"demo":{"P":{"origin":[286.950526698431,207.8860923861641],"scale":1.0766650121679933,"azimuth":64,"elevation":30}},"worst":{"P":{"origin":[266.75157776142584,201.43043350846153],"scale":1.0408162209598515,"azimuth":64,"elevation":30}}};
const ROD_R = 1.6, ARM_LOW = 77, ARM_HIGH = 89;

// Live code for the rung 3 cache page. The build inlines it after the anatomy kit, this folder's
// model.mjs (with the earlier explainer's applyOp and copyState), the data sets and each figure's camera.
// The page's step sets the state; the figure plays the arm along one timeline, forward for Next and
// backward for Back, so at rest it always shows the state the step text names. Nothing idles.

const reduceQuery = matchMedia("(prefers-reduced-motion: reduce)");

// ---- formatting ----
const nf = new Intl.NumberFormat("en-US");
const plural = new Intl.PluralRules("en-US");
const ms = (n) => nf.format(n) + "\u00a0ms";
const word = (n, one, many) => (plural.select(n) === "one" ? one : many);
const valueText = (v) => (v === "" ? "an empty value" : v);

// ---- elements ----
const $ = (id) => document.getElementById(id);
const el = {
  qlist: $("qlist"), qcount: $("qcount"), slots: $("slots"), rows: $("rows"), evicted: $("evicted"),
  hits: $("hits"), misses: $("misses"), waited: $("waited"), hitsWord: $("hitsWord"), missesWord: $("missesWord"),
  back: $("back"), next: $("next"), stepno: $("stepno"), stephead: $("stephead"), stepbody: $("stepbody"), steptext: document.querySelector(".steptext"),
  cacheCost: $("cacheCost"), storeCost: $("storeCost"), stage: $("stage"), readout: document.querySelector("[data-readout]"),
};
const make = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

// A key that turns bold when its row is touched: the text sits over a hidden bold copy of
// itself (CSS stacks both in one grid cell), so bolding never rewraps the row.
const boldSafe = (node, text) => {
  node.dataset.text = text;
  node.append(make("span", null, text));
  return node;
};

const state = { set: "demo", ds: null, steps: [], step: 0 };

// ---- the figure ----
const fig = { name: null, P: null, track: null, svg: null, t: 0, target: 0, raf: 0, last: 0, drawnGz: null, drawnHeld: undefined, say: "" };

function mountFigure(name) {
  if (fig.name !== name) {
    const tpl = document.querySelector(`template[data-figure="${name}"]`);
    el.stage.replaceChildren(tpl.content.cloneNode(true));
    fig.name = name;
    fig.P = FIGS[name].P;
    fig.svg = el.stage.querySelector("svg");
    fig.sort = fig.svg.querySelector('[data-layer="sort"]');
    fig.head = fig.svg.querySelector('[data-part="head"]');
    fig.grip = fig.svg.querySelector('[data-part="grip"]');
    fig.hold = fig.grip.querySelector('[data-part="hold"]');
    fig.rodLow = fig.grip.querySelector('[data-part="rod-low"]');
    fig.rodUp = fig.head.querySelector('[data-part="rod-up"]');
    fig.blocks = Object.fromEntries([...fig.svg.querySelectorAll("[data-block]")].map((b) => [b.dataset.block, b]));
  }
  fig.drawnGz = null;
  fig.drawnHeld = undefined;
}

const tr = (by) => translateAlong(fig.P, by);
const rodLowSvg = (gz) => solidSvg(cylinder(0, M.ROW_Y, ROD_R, 6, ARM_LOW - gz - 6, fig.P, 16), { tone: "hi", crease: "none" });
const rodUpSvg = (gz) => solidSvg(cylinder(0, M.ROW_Y, ROD_R, ARM_HIGH, gz + 6 + M.ROD - ARM_HIGH, fig.P, 16), { tone: "hi", crease: "none" }) + solidSvg(cylinder(0, M.ROW_Y, 2.6, gz + 6 + M.ROD, 2, fig.P, 20, 0.3), { tone: "mid" });

// Draw one state: the same parts and the same painter's keys the audit checks.
function drawState(V) {
  fig.head.setAttribute("transform", tr([V.hx, 0, 0]));
  fig.grip.setAttribute("transform", tr([V.hx, 0, V.gz]));
  if (V.gz !== fig.drawnGz) {
    fig.rodLow.innerHTML = rodLowSvg(V.gz);
    fig.rodUp.innerHTML = rodUpSvg(V.gz);
    fig.drawnGz = V.gz;
  }
  if (V.held !== fig.drawnHeld) {
    for (const b of Object.keys(fig.blocks)) if (b !== V.held && fig.blocks[b].parentNode !== fig.sort) fig.sort.appendChild(fig.blocks[b]);
    if (V.held) {
      fig.hold.appendChild(fig.blocks[V.held]);
      fig.blocks[V.held].setAttribute("transform", tr([0, 0, -M.BLOCK]));
    }
    fig.drawnHeld = V.held;
  }
  const half = M.BLOCK / 2;
  for (const b of Object.keys(fig.blocks)) {
    if (b === V.held) continue;
    const [x, z] = V.pos[b];
    fig.blocks[b].setAttribute("transform", tr([x, 0, z]));
    fig.blocks[b].dataset.key = depthOf([x, M.ROW_Y, z + half], fig.P).toFixed(3);
  }
  fig.grip.dataset.key = depthOf([V.hx, M.ROW_Y, V.held ? V.gz - half : V.gz + 1], fig.P).toFixed(3);
  const children = [...fig.sort.children];
  const order = children.slice().sort((a, b) => Number(a.dataset.key) - Number(b.dataset.key));
  if (order.some((n, i) => n !== children[i])) order.forEach((n) => fig.sort.appendChild(n));
  for (const b of Object.keys(fig.blocks)) {
    const solid = fig.blocks[b].querySelector(".iso-solid");
    if (b === V.lit) solid.setAttribute("data-lit", "");
    else solid.removeAttribute("data-lit");
  }
}

function drawAt(t) {
  const { state: V, op } = stateAt(fig.track, t);
  drawState(V);
  // The corner says what the arm is doing while it moves, and nothing at rest.
  const say = op >= 0 && t !== fig.target ? fig.track.ops[op].say : "";
  if (say !== fig.say) {
    el.readout.textContent = say;
    fig.say = say;
  }
}

// The step the cursor sits in, counted as the number of rest points behind it.
const stepIndexAt = (t) => {
  const times = fig.track.times;
  let n = 0;
  while (n + 1 < times.length && times[n + 1] <= t + 1e-9) n++;
  return n;
};

// Ride the timeline to the target. The step next to the target plays at its own pace;
// steps further away (a Next pressed mid-step) catch up at three times the pace.
function frame(now) {
  const dt = Math.min(0.05, (now - fig.last) / 1000);
  fig.last = now;
  const dir = Math.sign(fig.target - fig.t);
  const times = fig.track.times;
  const goal = state.step;
  const near = dir > 0 ? fig.t >= times[Math.max(0, goal - 1)] - 1e-9 : fig.t <= times[Math.min(times.length - 1, goal + 1)] + 1e-9;
  fig.t += dir * dt * (near ? 1 : 3);
  if ((dir > 0 && fig.t >= fig.target) || (dir < 0 && fig.t <= fig.target) || dir === 0) fig.t = fig.target;
  drawAt(fig.t);
  if (fig.t !== fig.target) fig.raf = requestAnimationFrame(frame);
  else fig.raf = 0;
}

function stopFigure() {
  if (fig.raf) cancelAnimationFrame(fig.raf);
  fig.raf = 0;
}

let fade = null;
function figureTo(step, how) {
  fig.target = fig.track.times[step];
  if (how === "snap" || reduceQuery.matches || how === "jump") {
    stopFigure();
    fig.t = fig.target;
    drawAt(fig.t);
    // A jump of more than one step, and every step under reduced motion, lands at once and fades in.
    if (how !== "snap") {
      if (fade) fade.cancel();
      fade = fig.svg.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: SLEEK.reducedFade * 1000, easing: "linear" });
    }
    return;
  }
  if (!fig.raf) {
    fig.last = performance.now();
    fig.raf = requestAnimationFrame(frame);
  }
}

// ---- the page ----
function build() {
  const ds = state.ds;
  el.qlist.textContent = "";
  state.steps.forEach((s) => {
    const li = make("li", "q future");
    const b = make("button");
    b.type = "button";
    b.append(make("span", "qn", String(s.n)), make("span", "dot " + (s.hit ? "hit" : "miss")), boldSafe(make("span", "qk"), s.key), make("span", "qt", ms(s.cost)));
    b.addEventListener("click", () => go(s.n, b));
    li.append(b);
    el.qlist.append(li);
  });
  el.qcount.textContent = nf.format(state.steps.length) + " " + word(state.steps.length, "request", "requests");
  el.slots.textContent = "";
  for (let i = 0; i < ds.capacity; i++) {
    const li = make("li", "slot empty");
    li.append(make("span", "key", "Empty"), make("span", "used", ""), make("span", "val", ""));
    el.slots.append(li);
  }
  el.rows.textContent = "";
  ds.store.forEach((r) => {
    const li = make("li", "row");
    li.append(boldSafe(make("span", "key"), r.key), make("span", "val", valueText(r.value)));
    el.rows.append(li);
  });
  el.cacheCost.textContent = nf.format(ds.capacity) + " " + word(ds.capacity, "slot", "slots") + ", about " + ms(ds.cacheMs);
  const avg = ds.store.length ? Math.round(ds.store.reduce((a, r) => a + r.ms, 0) / ds.store.length) : 0;
  el.storeCost.textContent = "about " + ms(avg);
  reserveTotals();
}

// The step heading, the step text, each cache slot and the eviction line keep the tallest height they reach
// at any step of this data set, so a step never pushes the panels below them. It paints
// every step once with transitions off, then puts the current step back.
function reserveHeights() {
  const boxes = [el.stephead, el.steptext, el.evicted, ...el.slots.children];
  const keep = state.step;
  document.documentElement.classList.add("measuring");
  el.steptext.setAttribute("aria-busy", "true");
  boxes.forEach((b) => (b.style.minHeight = ""));
  const tall = boxes.map(() => 0);
  for (let s = 0; s <= state.steps.length; s++) {
    state.step = s;
    paint();
    boxes.forEach((b, i) => (tall[i] = Math.max(tall[i], b.getBoundingClientRect().height)));
  }
  state.step = keep;
  paint();
  boxes.forEach((b, i) => (b.style.minHeight = Math.ceil(tall[i]) + "px"));
  el.steptext.getBoundingClientRect();
  document.documentElement.classList.remove("measuring");
  el.steptext.removeAttribute("aria-busy");
}

// Each total keeps the width of the widest text it will show in this data set, so the
// stats row holds still as "1 miss" becomes "2 misses". Runs again once the fonts load.
function reserveTotals() {
  const end = state.steps[state.steps.length - 1];
  const widest = [
    [el.hits, nf.format(end ? end.hits : 0)], [el.hitsWord, "hits"],
    [el.misses, nf.format(end ? end.misses : 0)], [el.missesWord, "misses"],
    [el.waited, ms(end ? end.ms : 0)],
  ];
  for (const [node, text] of widest) {
    const was = node.textContent;
    node.style.minWidth = "";
    node.textContent = text;
    const w = node.getBoundingClientRect().width;
    node.textContent = was;
    node.style.minWidth = Math.ceil(w) + "px";
  }
}

function render() {
  paint();
  const cur = state.step > 0 ? state.steps[state.step - 1] : null;
  const items = el.qlist.children;
  if (cur) {
    const row = items[state.step - 1];
    const list = el.qlist;
    const top = row.offsetTop - list.offsetTop;
    const bottom = top + row.offsetHeight;
    if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) list.scrollTo({ top: Math.max(0, top - list.clientHeight / 2 + row.offsetHeight / 2), behavior: reduceQuery.matches ? "auto" : "smooth" });
  }
  landStore(cur);
  edges();
}

// Write the step's state into the lists, totals and step text. No scrolling here, so
// reserveHeights can run it for every step.
function paint() {
  const steps = state.steps;
  const cur = state.step > 0 ? steps[state.step - 1] : null;

  // Request list
  const items = el.qlist.children;
  for (let i = 0; i < items.length; i++) {
    const li = items[i];
    const n = i + 1;
    li.classList.toggle("future", n > state.step);
    li.classList.toggle("current", n === state.step);
    if (n === state.step) { li.setAttribute("data-ui-need", ""); li.firstChild.setAttribute("aria-current", "step"); }
    else { li.removeAttribute("data-ui-need"); li.firstChild.removeAttribute("aria-current"); }
  }
  // Totals
  const hits = cur ? cur.hits : 0;
  const misses = cur ? cur.misses : 0;
  el.hits.textContent = nf.format(hits);
  el.hitsWord.textContent = word(hits, "hit", "hits");
  el.misses.textContent = nf.format(misses);
  el.missesWord.textContent = word(misses, "miss", "misses");
  el.waited.textContent = ms(cur ? cur.ms : 0);

  // Cache slots, left to right as the rack's slots
  const slotEls = el.slots.children;
  const snap = cur ? cur.slots : [];
  for (let j = 0; j < slotEls.length; j++) {
    const s = snap[j] || null;
    const se = slotEls[j];
    const touched = !!cur && cur.idx === j;
    se.classList.toggle("empty", !s);
    se.classList.toggle("touched", touched);
    if (touched) se.setAttribute("data-ui-need", ""); else se.removeAttribute("data-ui-need");
    se.children[0].textContent = s ? s.key : "Empty";
    se.children[1].textContent = s ? "used step " + s.used : "";
    se.children[2].textContent = s ? valueText(s.value) : "";
  }
  el.evicted.textContent = "";
  if (cur && cur.evicted) el.evicted.append(make("s", null, cur.evicted.key), document.createTextNode(" went back to the store, last used step " + cur.evicted.used));

  // Store rows: the one fetched, and the one an evicted key went back to
  const rowEls = el.rows.children;
  for (let r = 0; r < rowEls.length; r++) {
    const touched = !!cur && !cur.hit && cur.storeIndex === r;
    rowEls[r].classList.toggle("touched", touched);
    rowEls[r].classList.toggle("returned", !!cur && !!cur.evicted && cur.evicted.storeIndex === r);
    if (touched) rowEls[r].setAttribute("data-ui-need", ""); else rowEls[r].removeAttribute("data-ui-need");
  }
  // Step text
  const total = steps.length;
  el.stepno.textContent = total ? "Step " + state.step + " of " + total : "";
  if (!cur) {
    el.stephead.textContent = "Nothing asked yet";
    el.stepbody.textContent = "The cache starts empty, with room for " + nf.format(state.ds.capacity) + " answers.";
  } else if (cur.hit) {
    el.stephead.textContent = cur.key + ": a hit";
    el.stepbody.textContent = "The cache already held " + cur.key + ", so the arm lifted it from the cache and the app got its answer in " + ms(cur.cost) + ". The store was never asked.";
  } else {
    el.stephead.textContent = cur.key + ": a miss";
    let body = cur.evicted
      ? "The cache was full, so the arm first put " + cur.evicted.key + " back in the store. It had gone unused the longest, since step " + cur.evicted.used + ". "
      : "";
    body += "Then it fetched " + cur.key + " from the store, which took " + ms(cur.storeMs) + ", and kept it in the cache.";
    if (!cur.evicted) body = "The cache did not hold " + cur.key + ", so the arm fetched it from the store, which took " + ms(cur.storeMs) + ". It went into an empty slot.";
    el.stepbody.textContent = body;
  }
  el.back.disabled = state.step <= 0;
  el.next.disabled = state.step >= total;
}

function tap(node) {
  if (reduceQuery.matches || !node) return;
  const curve = [];
  for (let i = 0; i <= 24; i++) curve.push(springAt((i / 24) * SLEEK.tap.d * 1.6, SLEEK.tap.d, SLEEK.tap.b).value.toFixed(4));
  node.animate([{ transform: "scale(" + SLEEK.tap.amount + ")" }, { transform: "scale(1)" }], { duration: SLEEK.tap.d * 1600, easing: "linear(" + curve.join(", ") + ")" });
}

function go(n, source) {
  const max = state.steps.length;
  n = Math.max(0, Math.min(max, n));
  if (n === state.step) return;
  const from = state.step;
  state.step = n;
  tap(source);
  render();
  figureTo(n, Math.abs(n - from) > 1 ? "jump" : "play");
}

function load(set) {
  state.set = DATA[set] ? set : "demo";
  state.ds = DATA[state.set];
  state.steps = simulate(state.ds);
  state.step = state.steps.length ? 1 : 0;
  stopFigure();
  mountFigure(FIGURE_OF[state.set]);
  fig.track = trackOf(layoutOf(state.ds.store.length), state.steps);
  build();
  reserveHeights();
  render();
  fig.t = fig.track.times[state.step];
  figureTo(state.step, "snap");
  document.querySelectorAll(".chrome button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.set === state.set)));
}

el.back.addEventListener("click", () => go(state.step - 1, el.back));
el.next.addEventListener("click", () => go(state.step + 1, el.next));
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") { e.preventDefault(); if (state.step < state.steps.length) go(state.step + 1, el.next); }
  if (e.key === "ArrowLeft") { e.preventDefault(); if (state.step > 0) go(state.step - 1, el.back); }
});

// The store list lands on a row's top edge, with the touched row fully in view.
// It runs again once the web fonts load, because they change the row heights.
function landStore(cur) {
  if (!cur || cur.hit) return;
  const box = el.rows;
  const rowEls = box.children;
  const touchedRow = rowEls[cur.storeIndex];
  const was = box.scrollTop;
  const rt = touchedRow.offsetTop;
  const h = touchedRow.offsetHeight;
  let onEdge = false;
  for (const r of rowEls) if (Math.abs(r.offsetTop - was) < 1) onEdge = true;
  if (onEdge && rt >= was && rt + h <= was + box.clientHeight) return;
  let land = rt;
  for (const r of rowEls) {
    const top = r.offsetTop;
    if (top <= rt && rt + h - top <= box.clientHeight && top < land) land = top;
  }
  box.style.setProperty("--tail", "0px");
  const room = land - (box.scrollHeight - box.clientHeight);
  if (room > 0) box.style.setProperty("--tail", room + "px");
  box.scrollTop = land;
}

// A list with more rows below its height cap fades at the bottom edge.
function edges() {
  [el.qlist, el.rows].forEach((l) => l.classList.toggle("more", l.scrollTop + l.clientHeight < l.scrollHeight - 1));
}
el.qlist.addEventListener("scroll", edges, { passive: true });
el.rows.addEventListener("scroll", edges, { passive: true });
addEventListener("resize", edges);
let resizeQueued = 0;
addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = requestAnimationFrame(() => { resizeQueued = 0; reserveTotals(); reserveHeights(); });
});
if (document.fonts) document.fonts.ready.then(() => { reserveTotals(); reserveHeights(); landStore(state.step ? state.steps[state.step - 1] : null); edges(); });

document.querySelectorAll(".chrome button").forEach((b) => {
  b.addEventListener("click", () => {
    const url = new URL(location.href);
    if (b.dataset.set === "demo") url.searchParams.delete("data");
    else url.searchParams.set("data", b.dataset.set);
    history.replaceState(null, "", url);
    load(b.dataset.set);
  });
});

window.cacheExplainer = {
  state: () => {
    const cur = state.step ? state.steps[state.step - 1] : null;
    const V = stateAt(fig.track, fig.t).state;
    return { step: state.step, of: state.steps.length, key: cur && cur.key, result: cur ? (cur.hit ? "hit" : "miss") : null, moving: fig.t !== fig.target, arm: { hx: +V.hx.toFixed(2), gz: +V.gz.toFixed(2), held: V.held }, lit: V.lit };
  },
};

load(new URLSearchParams(location.search).get("data") || "demo");
</script>
</body>
</html>
