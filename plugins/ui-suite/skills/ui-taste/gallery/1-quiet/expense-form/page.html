<!doctype html>
<html lang="en" data-rung="1" data-look="quiet" data-motion="snappy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Expenses</title>
<script>
  // Theme before first paint: ?theme=light|dark wins, else the system setting.
  (function () {
    var p = new URLSearchParams(location.search).get("theme");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var set = function () { document.documentElement.setAttribute("data-theme", p === "light" || p === "dark" ? p : (mq.matches ? "dark" : "light")); };
    set();
    if (p !== "light" && p !== "dark") mq.addEventListener("change", set);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500&display=swap">
<style>
/* Tokens, grouped by function. Palette: Lunar and bronze (dark is the drawn one). */
:root {
  /* type */
  --face-ui: "Onest", system-ui, sans-serif;
  --face-display: "Unbounded", "Onest", system-ui, sans-serif;
  --t-meta: 13px;
  --t-ui: 14px;
  --t-input: 16px;
  --t-title: 24px;
  --t-figure: 32px;
  /* space */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  /* room under the content for the fixed demo toggle (12 px offset + 38 px tall + a gap) */
  --chrome-room: 64px;
  /* shape */
  --r-control: 8px;
  --r-region: 10px;
  --row: 40px;
  --control: 36px;
  /* motion: motion-kit feel "snappy", bounce 0 at rung 1 */
  --tap-d: 70ms;
  --tap-amount: 0.95;
  --enter-d: 160ms;
  --exit-d: 100ms;
  --move-d: 160ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
}
:root[data-theme="dark"] {
  --bg: #111111;
  --surface: #1c1c1c;
  --field: #161616;
  --line: #2e2e2e;
  --line-strong: #3d3d3d;
  --ink: #f2f2f2;
  --muted: #8f8f8f;
  --accent: #a08672;
  --accent-ink: #111111;
  --dim-bg: #232323;
  --dim-ink: #8f8f8f;
  --hover: #242424;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f1f0ee;
  --surface: #fafaf9;
  --field: #ffffff;
  --line: #e2dfdb;
  --line-strong: #ccc8c3;
  --ink: #1a1714;
  --muted: #6b645d;
  --accent: #7a604b;
  --accent-ink: #fbfaf8;
  --dim-bg: #e8e6e3;
  --dim-ink: #5c5650;
  --hover: #f0eeeb;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--face-ui);
  font-size: var(--t-ui);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }

/* header */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  column-gap: var(--s-4);
  row-gap: 2px;
  min-height: 56px;
  padding: var(--s-2) var(--s-6);
  border-bottom: 1px solid var(--line);
}
.top .brand { min-width: 0; overflow-wrap: anywhere; }
.top .team { font-weight: 600; }
.top .who { color: var(--muted); font-size: var(--t-meta); margin-left: auto; min-width: 0; text-align: right; overflow-wrap: break-word; }

/* page regions */
.page {
  display: grid;
  grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
  gap: var(--s-6);
  padding: var(--s-5) var(--s-6) var(--chrome-room);
  /* at least the window; taller when a short window cannot hold the form */
  min-height: max(640px, calc(100vh - 57px));
}
h1, h2 { margin: 0; font-family: var(--face-display); font-weight: 500; letter-spacing: -0.01em; }
h1 { font-size: var(--t-title); line-height: 1.2; }
h2 { font-size: 18px; line-height: 1.3; }

/* form */
form { display: flex; flex-direction: column; gap: var(--s-5); min-width: 0; }
.fields { display: grid; gap: var(--s-4); }
.field { display: grid; gap: var(--s-2); min-width: 0; }
.field > .label { display: flex; align-items: center; gap: var(--s-2); font-weight: 500; }
.req {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  flex: none;
  opacity: 0;
  transition: opacity var(--exit-d) var(--ease-out);
}
.field.missing .req { opacity: 1; transition-duration: var(--enter-d); }

.input {
  width: 100%;
  min-height: var(--control);
  padding: 7px var(--s-3);
  background: var(--field);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-control);
  font-size: var(--t-input);
  outline: none;
  transition: border-color var(--tap-d) var(--ease-out), box-shadow var(--tap-d) var(--ease-out);
}
.input:hover { border-color: var(--muted); }
.input:focus-visible, .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.input::placeholder { color: var(--muted); }
textarea.input { resize: none; field-sizing: content; min-height: 76px; max-height: 200px; overflow-y: auto; }

/* date: a themed field and a small month popover, no browser picker */
.datebox { position: relative; }
.date-btn { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); text-align: left; cursor: pointer; font-variant-numeric: tabular-nums; }
.date-btn svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
.date-btn[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.cal {
  position: absolute; left: 0; top: calc(100% + var(--s-1)); z-index: 5;
  width: 264px; padding: var(--s-2);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-region);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
  animation: arrive var(--enter-d) var(--ease-out) 1;
}
.cal[hidden] { display: none; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 var(--s-2); font-weight: 500; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-grid .wd { color: var(--muted); font-size: var(--t-meta); text-align: center; line-height: 28px; }
.day {
  height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--ink);
  font-size: var(--t-ui); font-variant-numeric: tabular-nums; cursor: pointer;
  transition: background-color var(--tap-d) var(--ease-out), transform var(--tap-d) var(--ease-out);
}
.day:hover { background: var(--hover); }
.day.today { font-weight: 600; }
.day[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.day:disabled { color: var(--line-strong); cursor: default; background: transparent; }
.day:active:not(:disabled) { transform: scale(var(--tap-amount)); }
.money { position: relative; }
.money .cur { position: absolute; left: var(--s-3); top: 50%; transform: translateY(-50%); color: var(--muted); font-size: var(--t-input); pointer-events: none; }
.money .input { padding-left: 26px; font-variant-numeric: tabular-nums; }

/* category: one selector style on this surface */
.choices { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.choice {
  min-height: 32px;
  padding: 0 var(--s-3);
  border-radius: var(--r-control);
  border: 1px solid var(--line-strong);
  background: var(--field);
  font-size: var(--t-ui);
  cursor: pointer;
  transition: background-color var(--tap-d) var(--ease-out), border-color var(--tap-d) var(--ease-out), color var(--tap-d) var(--ease-out), transform var(--tap-d) var(--ease-out);
}
.choice:hover { border-color: var(--muted); }
.choice[aria-checked="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* receipt: one surface. The whole empty surface is the label for the file input. */
.drop {
  display: flex;
  min-height: 66px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-control);
  background: var(--field);
  transition: border-color var(--tap-d) var(--ease-out), background-color var(--tap-d) var(--ease-out);
  min-width: 0;
}
.drop:not(.has-file):hover { border-color: var(--muted); background: var(--hover); }
.drop.over { border-color: var(--accent); border-style: solid; background: var(--hover); }
.drop.over.bad { border-color: var(--line-strong); border-style: dashed; }
.drop.over.bad .pick svg { color: var(--muted); }
.drop:has(.pick-input:focus-visible) { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
.pick {
  position: relative;
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  cursor: pointer;
}
.pick svg { width: 20px; height: 20px; flex: none; color: var(--muted); transition: color var(--tap-d) var(--ease-out); }
.drop.over .pick svg, .drop:not(.has-file):hover .pick svg { color: var(--accent); }
/* both lines share one cell, so the drag-over swap never changes the height */
.pick-text { display: grid; min-width: 0; }
.pick-text .idle-text, .pick-text .over-text { grid-area: 1 / 1; }
.pick-text .over-text { visibility: hidden; }
.drop.over .pick-text .idle-text { visibility: hidden; }
.drop.over .pick-text .over-text { visibility: visible; }
.pick-text .kinds { color: var(--muted); font-size: var(--t-meta); }
.pick-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
.file { display: none; align-items: center; gap: var(--s-2); min-width: 0; flex: 1; padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4); }
.has-file .file { display: flex; }
.has-file .pick { display: none; }
.file .name { min-width: 0; overflow-wrap: anywhere; }
.file .size { color: var(--muted); font-size: var(--t-meta); flex: none; font-variant-numeric: tabular-nums; }
.file .icon-btn { margin-left: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 32px;
  padding: 0 var(--s-3);
  border-radius: var(--r-control);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: var(--t-ui);
  font-weight: 500;
  cursor: pointer;
  transition: background-color var(--tap-d) var(--ease-out), transform var(--tap-d) var(--ease-out), opacity var(--move-d) var(--ease-out);
}
.btn:hover { background: var(--hover); }
.icon-btn {
  width: 28px; height: 28px; padding: 0; flex: none;
  display: inline-grid; place-items: center;
  border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer;
  transition: background-color var(--tap-d) var(--ease-out), color var(--tap-d) var(--ease-out), transform var(--tap-d) var(--ease-out);
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

.actions { display: flex; align-items: center; gap: var(--s-3); }
.submit {
  min-height: 40px; padding: 0 var(--s-5);
  border: 0;
  background: var(--accent); color: var(--accent-ink);
  font-size: var(--t-ui);
}
.submit:hover { background: var(--accent); filter: brightness(1.06); }
.submit[aria-disabled="true"] { background: var(--dim-bg); color: var(--dim-ink); filter: none; cursor: default; }
.submit.busy[aria-disabled="true"] { background: var(--accent); color: var(--accent-ink); cursor: progress; }
.submit .spin { display: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; }
.submit.busy .spin { display: inline-block; animation: spin 700ms linear 1; animation-iteration-count: 2; }
@keyframes spin { to { transform: rotate(360deg); } }

/* tap feedback: confirms the touch, nothing else moves */
.btn:active, .choice:active, .icon-btn:active, .submit:not([aria-disabled="true"]):active { transform: scale(var(--tap-amount)); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.input:focus-visible { outline: none; }

/* the team's recent expenses */
.ledger { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: var(--s-4); min-width: 0; min-height: 0; container: ledger / inline-size; }
/* Wide screens: the list region takes its height from the row, never from its
   rows, so a long list scrolls inside and the form sets the row height. */
@media (min-width: 861px) {
  .ledger { container-type: size; }
  .ledger .table { align-self: start; max-height: 100%; }
}
.sum { display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; min-width: 0; }
.sum .figure { font-family: var(--face-display); font-weight: 500; font-size: var(--t-figure); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sum .of { color: var(--muted); }
.table {
  display: grid;
  grid-template-rows: max-content minmax(0, 1fr); /* max-content: Safari 26 shrinks an auto row to the head's min-height (0) under max-height */
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-region);
  background: var(--surface);
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: 76px minmax(150px, 1.4fr) 104px minmax(160px, 1.6fr) 120px 84px;
  column-gap: var(--s-4);
  align-items: start;
  padding: 10px var(--s-4);
  min-height: var(--row);
}
.head { color: var(--muted); font-size: var(--t-meta); border-bottom: 1px solid var(--line); padding-top: var(--s-2); padding-bottom: var(--s-2); min-height: 0; }
.body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.body .row { border-bottom: 1px solid var(--line); transition: background-color var(--tap-d) var(--ease-out); }
.body .row:last-child { border-bottom: 0; }
.body .row:hover { background: var(--hover); }
.row > span { min-width: 0; overflow-wrap: anywhere; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.date, .cat, .status { color: var(--muted); }
.row.done > span { color: var(--muted); }
.row.done .person { color: var(--muted); }
.row.new { animation: arrive var(--enter-d) var(--ease-out) 1; }
@keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
.empty { padding: var(--s-6) var(--s-4); color: var(--muted); }

.made { color: var(--muted); font-size: var(--t-meta); }

/* demo-only data switch (break-ui), plain chrome */
.chrome {
  position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
  display: flex; gap: 8px; padding: 4px;
  background: #e9e9ec; border-radius: 10px;
  font-family: system-ui, sans-serif; font-size: 13px;
  border: 1px solid #d4d4d8;
  z-index: 10;
}
.chrome button { white-space: nowrap; min-height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: #333336; cursor: pointer; font-size: 13px; font-family: system-ui, sans-serif; }
.chrome button[aria-pressed="true"] { background: #ffffff; color: #111113; }

@media (max-width: 860px) {
  .top { padding: var(--s-2) var(--s-4); }
  .page { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; padding: var(--s-4) var(--s-4) 96px; gap: var(--s-6); }
  .table { max-height: 70vh; }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
/* The six-column row needs about 810 px. When the list region is narrower
   (a phone, or a laptop between 861 and about 1340 px), each expense
   takes two or three short lines instead, so no column is ever clipped. */
@container ledger (max-width: 820px) {
  .head { display: none; }
  .table { grid-template-rows: minmax(0, 1fr); }
  .row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "person amount" "note note" "meta status";
    row-gap: 2px;
  }
  .row .person { grid-area: person; }
  .row .num { grid-area: amount; }
  .row .note { grid-area: note; }
  .row .meta-line { grid-area: meta; }
  .row .status { grid-area: status; text-align: right; }
  .row .date, .row .cat { display: none; }
  .row .meta-line { display: block !important; color: var(--muted); font-size: var(--t-meta); }
  .row .status { font-size: var(--t-meta); }
}
.meta-line { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation: none !important; }
  .btn:active, .choice:active, .icon-btn:active, .submit:active { transform: none !important; }
  .submit.busy .spin { display: inline-block; border-right-color: currentColor; opacity: .5; }
}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><span class="team" id="team">Larkspur Studio</span> <span class="made">(a made-up example)</span></span>
  <span class="who" id="who">Noor Haddad</span>
</header>

<main class="page">
  <form id="form" novalidate autocomplete="off">
    <h1>New expense</h1>
    <div class="fields">
      <div class="field" data-key="date">
        <label class="label" for="date">Date<span class="req" aria-hidden="true"></span></label>
        <div class="datebox">
          <button type="button" class="input date-btn" id="date" aria-haspopup="dialog" aria-expanded="false"><span id="date-text"></span><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          <div class="cal" id="cal" role="dialog" aria-label="Choose a date" hidden>
            <div class="cal-head">
              <button type="button" class="icon-btn" id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <span id="cal-month" aria-live="polite"></span>
              <button type="button" class="icon-btn" id="cal-next" aria-label="Next month"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="cal-grid" id="cal-grid" role="grid"></div>
          </div>
        </div>
      </div>
      <div class="field" data-key="amount">
        <label class="label" for="amount">Amount<span class="req" aria-hidden="true"></span></label>
        <div class="money"><span class="cur" aria-hidden="true">$</span><input class="input" id="amount" inputmode="decimal" placeholder="0.00" maxlength="13" required aria-label="Amount in US dollars"></div>
      </div>
      <div class="field" data-key="category">
        <span class="label" id="cat-label">Category<span class="req" aria-hidden="true"></span></span>
        <div class="choices" role="radiogroup" aria-labelledby="cat-label" id="choices"></div>
      </div>
      <div class="field" data-key="note">
        <label class="label" for="note">Note</label>
        <textarea class="input" id="note" rows="3" maxlength="500"></textarea>
      </div>
      <div class="field" data-key="receipt">
        <span class="label" id="receipt-label">Receipt<span class="req" aria-hidden="true"></span></span>
        <div class="drop" id="drop" role="group" aria-labelledby="receipt-label">
          <label class="pick" for="file">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3.5M6 7.5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 12.5v2.5a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="pick-text"><span class="idle-text">Drop a receipt here, or choose a file</span><span class="over-text">Release to attach the receipt</span><span class="kinds">PDF or image</span></span>
            <input class="pick-input" id="file" type="file" accept="image/*,application/pdf" aria-labelledby="receipt-label" aria-describedby="pick-hint">
            <span id="pick-hint" hidden>Drop a receipt here, or choose a file. PDF or image.</span>
          </label>
          <div class="file">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none;color:var(--muted)"><path d="M4 1.5h5l3 3v10H4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 1.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span class="name" id="fname"></span>
            <span class="size" id="fsize"></span>
            <button type="button" class="icon-btn" id="clear-file" aria-label="Remove receipt" aria-describedby="tip-remove">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <span role="tooltip" id="tip-remove" hidden>Remove receipt</span>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button type="submit" class="btn submit" id="submit" aria-disabled="true"><span class="spin" aria-hidden="true"></span><span id="submit-text">Submit expense</span></button>
    </div>
  </form>

  <section class="ledger" aria-labelledby="ledger-title">
    <h2 id="ledger-title">Last 30 days</h2>
    <div class="sum"><span class="figure" id="total" data-ui-number>$0.00</span><span class="of" id="count">0 expenses</span></div>
    <div class="table" role="table" aria-labelledby="ledger-title">
      <div class="row head" role="row">
        <span role="columnheader">Date</span><span role="columnheader">Person</span><span role="columnheader">Category</span><span role="columnheader">Note</span><span role="columnheader" class="num">Amount</span><span role="columnheader">Status</span>
      </div>
      <div class="body" id="rows" role="rowgroup"></div>
    </div>
  </section>
</main>

<div class="chrome" data-ui-chrome role="group" aria-label="Data set">
  <button type="button" data-set="demo">Demo data</button>
  <button type="button" data-set="worst">Worst case</button>
  <button type="button" data-set="one">One</button>
  <button type="button" data-set="empty">Empty</button>
</div>

<script>
(function () {
  "use strict";
  var CATEGORIES = ["Travel", "Meals", "Software", "Equipment", "Other"];
  var REQUIRED = ["date", "amount", "category", "receipt"];
  var money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  var dayFmt = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" });
  var plural = new Intl.PluralRules("en-US");
  var today = new Date(); today.setHours(12, 0, 0, 0);
  function daysAgo(n) { var d = new Date(today); d.setDate(d.getDate() - n); return d; }

  // ---- data sets (the one boundary the page reads from) ----
  var DEMO = {
    team: "Larkspur Studio",
    me: "Noor Haddad",
    form: {},
    rows: [
      [0, "Teo Lindqvist", "Software", "Figma seat for October", 45, "Waiting"],
      [1, "Ama Owusu", "Meals", "Lunch with the Fernhill client", 86.4, "Waiting"],
      [2, "Noor Haddad", "Travel", "Train to Portland for the shoot", 132, "Approved"],
      [4, "Rafael Quintero", "Equipment", "Replacement tripod plate", 39.99, "Approved"],
      [5, "Iris Baek", "Software", "Font license, two seats", 120, "Paid"],
      [7, "Teo Lindqvist", "Travel", "Taxi from the airport", 54.25, "Paid"],
      [9, "Noor Haddad", "Meals", "Team breakfast", 63.8, "Paid"],
      [12, "Ama Owusu", "Equipment", "USB-C hub", 49, "Paid"],
      [15, "Rafael Quintero", "Other", "Courier for print proofs", 28.5, "Paid"],
      [18, "Iris Baek", "Travel", "Parking at the venue", 22, "Paid"],
      [21, "Teo Lindqvist", "Equipment", "Monitor arm", 119, "Paid"],
      [24, "Noor Haddad", "Software", "Stock photo credits", 75, "Paid"]
    ]
  };
  var worstRows = [
    [0, "Aleksandra Wiśniewska-Kowalczyk", "Travel", "Hotel for the Northwind Industries Holdings quarterly offsite, three nights including the late checkout fee and parking", 1284903.07, "Waiting"],
    [0, "Jo", "Other", "", 0.01, "Approved"],
    [1, "Nguyễn Thị Phương Thảo", "Software", "https://northwind-industries-holdings.example.com/invoices/2026/10/INV-000384729-final-v2.pdf", 2399, "Waiting"],
    [1, "Bartholomew Fitzgerald-Montgomery III", "Meals", "Ăn trưa với khách hàng 🍜 và đội thiết kế", 86.4, "Approved"],
    [2, "สมชาย ใจดี", "Travel", "ค่าแท็กซี่ไปสนามบิน", 54.25, "Paid"],
    [3, "李", "Equipment", "显示器支架", 119, "Paid"]
  ];
  for (var i = 0; i < 54; i++) worstRows.push([4 + (i % 26), ["Teo Lindqvist", "Ama Owusu", "Iris Baek", "Rafael Quintero"][i % 4], CATEGORIES[i % 5], "Recurring item " + (i + 1), 10 + ((i * 37) % 400) + 0.5, i % 3 ? "Paid" : "Approved"]);
  var WORST = {
    team: "Larkspur and Whitcombe Architectural Lighting Studio, Northwind Holdings division",
    me: "Aleksandra Wiśniewska-Kowalczyk",
    form: { amount: "1284903.07", file: { name: "Receipt_scan_2026-10-14_Northwind-Industries-Holdings_invoice_000384729-final-v2.pdf", size: 48213904 }, note: "Hotel for the Northwind Industries Holdings quarterly offsite, three nights including the late checkout fee and parking" },
    rows: worstRows
  };
  var ONE = { team: "Jo", me: "Jo", form: {}, rows: [[0, "Jo", "Other", "", 0.01, "Waiting"]] };
  var EMPTY = { team: "Larkspur Studio", me: "Noor Haddad", form: {}, rows: [] };
  var SETS = { demo: DEMO, worst: WORST, one: ONE, empty: EMPTY };

  var params = new URLSearchParams(location.search);
  var setName = SETS[params.get("data")] ? params.get("data") : "demo";
  var rows = [];

  // ---- elements ----
  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), dateEl = $("date"), amountEl = $("amount"), noteEl = $("note"), fileEl = $("file");
  var drop = $("drop"), submit = $("submit"), submitText = $("submit-text"), list = $("rows");
  var category = null, file = null, busy = false, busyTimer = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  // category choices
  CATEGORIES.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.textContent = c;
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
    b.dataset.value = c;
    b.addEventListener("click", function () { category = category === c ? null : c; paintChoices(); update(); });
    $("choices").appendChild(b);
  });
  function paintChoices() {
    $("choices").querySelectorAll(".choice").forEach(function (b, i) {
      var on = b.dataset.value === category;
      b.setAttribute("aria-checked", String(on));
      b.tabIndex = on || (!category && i === 0) ? 0 : -1;
    });
  }
  $("choices").addEventListener("keydown", function (e) {
    var keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (!(e.key in keys)) return;
    e.preventDefault();
    var idx = Math.max(0, CATEGORIES.indexOf(category));
    category = CATEGORIES[(idx + keys[e.key] + CATEGORIES.length) % CATEGORIES.length];
    paintChoices(); update();
    $("choices").querySelector('[data-value="' + category + '"]').focus();
  });

  // amount: digits and one point, formatted on blur
  amountEl.addEventListener("input", function () {
    var v = amountEl.value.replace(/[^0-9.,]/g, "");
    var parts = v.split(".");
    if (parts.length > 2) v = parts[0] + "." + parts.slice(1).join("");
    if (v !== amountEl.value) amountEl.value = v;
    update();
  });
  amountEl.addEventListener("blur", function () {
    var n = parseAmount();
    if (n > 0) amountEl.value = fmtAmount(n);
    update();
  });
  function fmtAmount(n) { return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  amountEl.addEventListener("focus", function () { amountEl.value = amountEl.value.replace(/,/g, ""); });
  function parseAmount() { var n = parseFloat(amountEl.value.replace(/,/g, "")); return isFinite(n) ? n : 0; }
  // date: themed field with a month popover; days after today are off
  var dateValue = null, calMonth = null;
  var longFmt = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  var monthFmt = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" });
  var cal = $("cal"), calGrid = $("cal-grid");
  function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function setDate(d) { dateValue = d; $("date-text").textContent = d ? longFmt.format(d) : "Choose a date"; update(); }
  function paintCal(focusDay) {
    $("cal-month").textContent = monthFmt.format(calMonth);
    $("cal-next").disabled = calMonth.getFullYear() === today.getFullYear() && calMonth.getMonth() === today.getMonth();
    calGrid.textContent = "";
    ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].forEach(function (w) { var s = document.createElement("span"); s.className = "wd"; s.textContent = w; s.setAttribute("aria-hidden", "true"); calGrid.appendChild(s); });
    var first = new Date(calMonth); first.setDate(1);
    for (var k = 0; k < first.getDay(); k++) calGrid.appendChild(document.createElement("span"));
    var days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    for (var n = 1; n <= days; n++) {
      var d = new Date(first.getFullYear(), first.getMonth(), n, 12);
      var b = document.createElement("button");
      b.type = "button"; b.className = "day" + (sameDay(d, today) ? " today" : ""); b.textContent = n;
      b.setAttribute("aria-label", longFmt.format(d));
      b.setAttribute("aria-selected", String(sameDay(d, dateValue)));
      b.disabled = d > today;
      b.tabIndex = sameDay(d, focusDay) ? 0 : -1;
      b.dataset.day = n;
      calGrid.appendChild(b);
    }
    var f = calGrid.querySelector('.day[tabindex="0"]');
    if (f && !cal.hidden) f.focus();
  }
  function openCal() {
    var d = dateValue || today;
    calMonth = new Date(d.getFullYear(), d.getMonth(), 1, 12);
    cal.hidden = false; dateEl.setAttribute("aria-expanded", "true"); dateEl.setAttribute("aria-controls", "cal");
    paintCal(d);
  }
  function closeCal(back) { if (cal.hidden) return; cal.hidden = true; dateEl.setAttribute("aria-expanded", "false"); dateEl.removeAttribute("aria-controls"); if (back) dateEl.focus(); }
  dateEl.addEventListener("click", function () { if (cal.hidden) openCal(); else closeCal(true); });
  $("cal-prev").addEventListener("click", function () { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1, 12); paintCal(null); });
  $("cal-next").addEventListener("click", function () { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1, 12); paintCal(null); });
  calGrid.addEventListener("click", function (e) {
    var b = e.target.closest(".day"); if (!b || b.disabled) return;
    setDate(new Date(calMonth.getFullYear(), calMonth.getMonth(), Number(b.dataset.day), 12));
    closeCal(true);
  });
  calGrid.addEventListener("keydown", function (e) {
    var step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 7, ArrowUp: -7 }[e.key];
    var b = e.target.closest(".day"); if (!step || !b) return;
    e.preventDefault();
    var d = new Date(calMonth.getFullYear(), calMonth.getMonth(), Number(b.dataset.day) + step, 12);
    if (d > today) return;
    calMonth = new Date(d.getFullYear(), d.getMonth(), 1, 12);
    paintCal(d);
  });
  cal.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.preventDefault(); closeCal(true); } });
  document.addEventListener("pointerdown", function (e) { if (!cal.hidden && !e.target.closest(".datebox")) closeCal(false); });

  // receipt
  function sizeText(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : b >= 1024 ? Math.round(b / 1024) + " KB" : b + " bytes"; }
  // the picker filters by accept=; a drop does not, so check the type here too
  function okType(t, name) { return /^image\//.test(t) || t === "application/pdf" || (!t && /\.(pdf|png|jpe?g|heic|webp|gif)$/i.test(name || "")); }
  function setFile(f) {
    file = f;
    drop.classList.toggle("has-file", !!f);
    $("fname").textContent = f ? f.name : "";
    $("fsize").textContent = f ? sizeText(f.size) : "";
    update();
  }
  fileEl.addEventListener("change", function () { if (fileEl.files[0]) setFile(fileEl.files[0]); });
  $("clear-file").addEventListener("click", function () { fileEl.value = ""; setFile(null); fileEl.focus(); });
  // drag-over state: a depth count, so moving over the icon or text inside does not flicker it off
  var dragDepth = 0;
  var overText = drop.querySelector(".over-text");
  drop.addEventListener("dragenter", function (e) {
    e.preventDefault(); dragDepth++; drop.classList.add("over");
    var it = e.dataTransfer && e.dataTransfer.items && e.dataTransfer.items[0];
    var bad = it && it.kind === "file" && it.type && !okType(it.type);
    drop.classList.toggle("bad", !!bad);
    overText.textContent = bad ? "Only a PDF or an image can be attached" : "Release to attach the receipt";
  });
  drop.addEventListener("dragover", function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
  drop.addEventListener("dragleave", function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove("over", "bad"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; drop.classList.remove("over", "bad");
    var f = e.dataTransfer && e.dataTransfer.files[0]; if (f && okType(f.type, f.name)) setFile(f);
  });
  // a file dropped a few pixels off the surface must not open in the tab and lose the form
  ["dragover", "drop"].forEach(function (t) { window.addEventListener(t, function (e) { if (!drop.contains(e.target)) e.preventDefault(); }); });

  // ---- the need: which required fields are still empty ----
  function missing() {
    var out = [];
    if (!dateValue) out.push("date");
    if (!(parseAmount() > 0)) out.push("amount");
    if (!category) out.push("category");
    if (!file) out.push("receipt");
    return out;
  }
  var NAMES = { date: "Date", amount: "Amount", category: "Category", receipt: "Receipt" };
  function update() {
    var gone = missing();
    form.querySelectorAll(".field").forEach(function (f) {
      var key = f.dataset.key;
      var miss = gone.indexOf(key) !== -1;
      f.classList.toggle("missing", miss);
      if (miss) f.setAttribute("data-ui-need", ""); else f.removeAttribute("data-ui-need");
    });
    var blocked = gone.length > 0 || busy;
    submit.setAttribute("aria-disabled", String(blocked));
    submit.title = gone.length ? "Still needed: " + gone.map(function (k) { return NAMES[k]; }).join(", ") : "";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var gone = missing();
    if (gone.length) {
      var first = form.querySelector('.field[data-key="' + gone[0] + '"]');
      var target = first.querySelector('.date-btn, input:not([hidden]), textarea, .choice[tabindex="0"]');
      if (target) target.focus();
      return;
    }
    busy = true;
    submit.classList.add("busy");
    submitText.textContent = "Sending";
    update();
    clearTimeout(busyTimer);
    busyTimer = setTimeout(function () {
      var d = new Date(dateValue);
      rows.unshift({ date: d, person: SETS[setName].me, cat: category, note: noteEl.value.trim(), amount: parseAmount(), status: "Waiting", fresh: true });
      busy = false;
      submit.classList.remove("busy");
      submitText.textContent = "Submit expense";
      resetForm({});
      render();
    }, 900);
  });

  function resetForm(pre) {
    closeCal(false);
    setDate(new Date(today));
    amountEl.value = pre.amount ? fmtAmount(Number(pre.amount)) : "";
    noteEl.value = pre.note || "";
    category = pre.category || null;
    fileEl.value = "";
    paintChoices();
    setFile(pre.file || null);
  }

  // ---- list ----
  function cell(cls, text, role) { var s = document.createElement("span"); s.className = cls; s.textContent = text; s.setAttribute("role", role || "cell"); return s; }
  function render() {
    var keep = list.scrollTop;
    list.textContent = "";
    var total = 0;
    rows.forEach(function (r) {
      total += r.amount;
      var row = document.createElement("div");
      row.className = "row" + (r.status === "Paid" ? " done" : "") + (r.fresh && !reduce.matches ? " new" : "");
      row.setAttribute("role", "row");
      var date = dayFmt.format(r.date);
      row.appendChild(cell("date", date));
      row.appendChild(cell("person", r.person));
      row.appendChild(cell("cat", r.cat));
      row.appendChild(cell("note", r.note));
      row.appendChild(cell("num", money.format(r.amount)));
      row.appendChild(cell("status", r.status));
      var meta = cell("meta-line", date + ", " + r.cat); meta.setAttribute("aria-hidden", "true"); meta.removeAttribute("role");
      row.appendChild(meta);
      if (!r.note) row.querySelector(".note").setAttribute("aria-label", "No note");
      list.appendChild(row);
      r.fresh = false;
    });
    if (!rows.length) {
      var e = document.createElement("div");
      e.className = "empty"; e.setAttribute("role", "row");
      e.appendChild(cell("", "No expenses in the last 30 days"));
      list.appendChild(e);
    }
    $("total").textContent = money.format(total);
    $("count").textContent = rows.length + " " + (plural.select(rows.length) === "one" ? "expense" : "expenses");
    list.scrollTop = keep;
  }

  function load(name) {
    setName = name;
    var s = SETS[name];
    $("team").textContent = s.team;
    $("who").textContent = s.me;
    rows = s.rows.map(function (r) { return { date: daysAgo(r[0]), person: r[1], cat: r[2], note: r[3], amount: r[4], status: r[5] }; });
    resetForm(s.form);
    list.scrollTop = 0;
    render();
    document.querySelectorAll(".chrome button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.set === name)); });
  }
  document.querySelectorAll(".chrome button").forEach(function (b) {
    b.addEventListener("click", function () {
      var p = new URLSearchParams(location.search);
      if (b.dataset.set === "demo") p.delete("data"); else p.set("data", b.dataset.set);
      var q = p.toString();
      history.replaceState(null, "", location.pathname + (q ? "?" + q : ""));
      load(b.dataset.set);
    });
  });

  load(setName);
})();
</script>
</body>
</html>
